<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Changes — Pure Platinum Wiki</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0f1117;
      --surface:    #1a1d27;
      --surface2:   #22263a;
      --accent:     #e63946;
      --accent2:    #457b9d;
      --text:       #e8eaf0;
      --text-muted: #7a7f99;
      --sidebar-w:  260px;
      --header-h:   64px;
      --radius:     10px;
      --tr:         0.3s cubic-bezier(0.4,0,0.2,1);
    }

    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; overflow-x: hidden;
    }

    /* ── SIDEBAR OVERLAY ─────────────────────────── */
    #overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      opacity: 0; pointer-events: none;
      transition: opacity var(--tr); z-index: 90;
    }
    #overlay.visible { opacity: 1; pointer-events: all; }

    /* ── SIDEBAR ─────────────────────────────────── */
    #sidebar {
      position: fixed; top: 0; left: 0;
      width: var(--sidebar-w); height: 100vh;
      background: var(--surface);
      border-right: 1px solid rgba(255,255,255,0.06);
      transform: translateX(calc(-1 * var(--sidebar-w)));
      transition: transform var(--tr);
      z-index: 100; display: flex; flex-direction: column;
      padding-top: var(--header-h);
    }
    #sidebar.open { transform: translateX(0); }
    .sidebar-header {
      padding: 24px 24px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .sidebar-title {
      font-size: 0.75rem; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-muted);
    }
    .sidebar-nav { padding: 12px 0; flex: 1; }
    .nav-item {
      display: flex; align-items: center; gap: 14px;
      padding: 13px 24px; color: var(--text-muted); cursor: pointer;
      border-left: 3px solid transparent;
      transition: color .2s, background .2s, border-color .2s;
      font-size: 0.95rem; font-weight: 500;
      text-decoration: none; user-select: none;
    }
    .nav-item:hover, .nav-item.active {
      background: var(--surface2); color: var(--text);
      border-left-color: var(--accent);
    }
    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.7; }
    .nav-item:hover svg, .nav-item.active svg { opacity: 1; }

    /* ── HEADER ──────────────────────────────────── */
    #header {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--header-h); background: var(--surface);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex; align-items: center;
      padding: 0 24px; z-index: 80; gap: 16px;
    }
    #logo-btn {
      background: none; border: none; cursor: pointer;
      padding: 6px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s, transform .2s; flex-shrink: 0;
    }
    #logo-btn:hover { background: rgba(255,255,255,.07); transform: rotate(15deg); }
    #logo-btn:active { transform: rotate(15deg) scale(.92); }
    .pball-top    { fill: #e63946; }
    .pball-bot    { fill: #d0d4e8; }
    .pball-band   { fill: #111318; }
    .pball-center { fill: #111318; stroke: #d0d4e8; stroke-width: 2.5; }
    .pball-dot    { fill: #d0d4e8; }
    #site-name {
      font-size: 1.05rem; font-weight: 700;
      letter-spacing: .04em; color: var(--text);
      text-decoration: none; user-select: none;
    }
    #site-name span { color: var(--accent); }

    /* ── MAIN ────────────────────────────────────── */
    #main {
      padding-top: calc(var(--header-h) + 28px);
      padding-bottom: 48px; max-width: 900px;
      margin: 0 auto; padding-left: 24px; padding-right: 24px;
    }

    /* ── TOOLBAR ─────────────────────────────────── */
    .toolbar {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 24px; flex-wrap: wrap;
    }
    .toolbar h1 {
      font-size: 1.4rem; font-weight: 800;
      letter-spacing: -.01em; flex: 1;
    }
    .toolbar h1 span { color: var(--accent); }

    /* ── CATEGORY SECTIONS ───────────────────────── */
    .category-section { margin-bottom: 36px; }
    .category-title {
      font-size: 0.7rem; font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .change-list { display: flex; flex-direction: column; gap: 6px; }

    /* ── CHANGE ITEM ─────────────────────────────── */
    .change-item {
      display: flex; align-items: center; gap: 14px;
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: var(--radius);
      padding: 14px 18px;
      cursor: pointer;
      transition: border-color .2s, background .2s, transform .15s;
      user-select: none;
    }
    .change-item:hover {
      border-color: rgba(255,255,255,0.18);
      background: var(--surface2);
      transform: translateX(4px);
    }
    .change-item-title {
      font-size: 0.95rem; font-weight: 600;
      color: var(--text); flex: 1;
    }
    .change-item-arrow {
      color: var(--text-muted); flex-shrink: 0;
      transition: color .2s, transform .2s;
    }
    .change-item:hover .change-item-arrow {
      color: var(--accent); transform: translateX(3px);
    }

    /* ── MODAL ───────────────────────────────────── */
    #modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.72);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; opacity: 0; pointer-events: none;
      transition: opacity var(--tr);
    }
    #modal-backdrop.open { opacity: 1; pointer-events: all; }
    #modal-panel {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      width: min(680px, calc(100vw - 32px));
      max-height: calc(100vh - 48px);
      overflow-y: auto;
      padding: 32px;
      position: relative;
      transform: translateY(20px);
      transition: transform var(--tr);
    }
    #modal-backdrop.open #modal-panel { transform: translateY(0); }

    #modal-close {
      position: absolute; top: 16px; right: 16px;
      background: rgba(255,255,255,0.06);
      border: none; border-radius: 50%;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-muted);
      transition: background .2s, color .2s;
    }
    #modal-close:hover { background: rgba(255,255,255,0.12); color: var(--text); }

    #modal-category {
      font-size: 0.65rem; font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 8px;
    }
    #modal-title {
      font-size: 1.45rem; font-weight: 800;
      padding-right: 36px; margin-bottom: 20px;
      line-height: 1.25;
    }
    #modal-body {
      font-size: 0.88rem; color: var(--text-muted);
      line-height: 1.7; white-space: pre-wrap;
    }
    #modal-body strong { color: var(--text); }

    /* inline table rendering */
    .md-table {
      width: 100%; border-collapse: collapse;
      margin: 12px 0; font-size: 0.82rem;
    }
    .md-table th, .md-table td {
      padding: 7px 14px;
      border: 1px solid rgba(255,255,255,0.08);
      text-align: left;
    }
    .md-table th {
      background: var(--surface2);
      color: var(--text); font-weight: 700;
      font-size: 0.7rem; letter-spacing: .05em; text-transform: uppercase;
    }
    .md-table td { color: var(--text-muted); }
    .md-table tr:hover td { background: rgba(255,255,255,0.03); }

    #loading { text-align: center; padding: 80px 0; color: var(--text-muted); }
  </style>
</head>
<body>

<div id="overlay"></div>

<!-- ── Sidebar ──────────────────────────────────────────── -->
<nav id="sidebar">
  <div class="sidebar-header"><span class="sidebar-title">Navigation</span></div>
  <div class="sidebar-nav">
    <a class="nav-item" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
      </svg>Home
    </a>
    <a class="nav-item active" href="/changes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>Changes
    </a>
    <a class="nav-item" href="/trainers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>Trainers
    </a>
    <a class="nav-item" href="/pokemon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="2" y1="12" x2="22" y2="12"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>Pokémon
    </a>
    <a class="nav-item" href="/items">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
        <path d="M16 7V5a2 2 0 0 0-4 0v2"/>
        <line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/>
      </svg>Items
    </a>
    <a class="nav-item" href="/moves">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>Moves
    </a>
    <a class="nav-item" href="/encounters">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <path d="M9 22V12h6v10"/>
        <circle cx="12" cy="7" r="2"/>
      </svg>Encounters
    </a>
  </div>
</nav>

<!-- ── Header ───────────────────────────────────────────── -->
<header id="header">
  <button id="logo-btn" aria-label="Toggle menu">
    <svg width="36" height="36" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
      <clipPath id="clip-circle"><circle cx="18" cy="18" r="16"/></clipPath>
      <circle cx="18" cy="18" r="16" class="pball-bot"/>
      <rect x="2" y="2" width="32" height="16" class="pball-top" clip-path="url(#clip-circle)"/>
      <rect x="2" y="16" width="32" height="4" class="pball-band"/>
      <circle cx="18" cy="18" r="5" class="pball-center"/>
      <circle cx="18" cy="18" r="2.5" class="pball-dot"/>
    </svg>
  </button>
  <a id="site-name" href="/">Pure <span>Platinum</span> Wiki</a>
</header>

<!-- ── Main ─────────────────────────────────────────────── -->
<main id="main">
  <div class="toolbar">
    <h1>Game <span>Changes</span></h1>
  </div>
  <div id="loading">Loading changes…</div>
  <div id="change-sections"></div>
</main>

<!-- ── Modal ────────────────────────────────────────────── -->
<div id="modal-backdrop">
  <div id="modal-panel">
    <button id="modal-close" aria-label="Close">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="1" y1="1" x2="13" y2="13"/><line x1="13" y1="1" x2="1" y2="13"/>
      </svg>
    </button>
    <div id="modal-category"></div>
    <div id="modal-title"></div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
// ── sidebar ────────────────────────────────────────────────────────────────
const btn      = document.getElementById('logo-btn');
const sidebar  = document.getElementById('sidebar');
const overlay  = document.getElementById('overlay');
const openSidebar  = () => { sidebar.classList.add('open');    overlay.classList.add('visible'); };
const closeSidebar = () => { sidebar.classList.remove('open'); overlay.classList.remove('visible'); };
btn.addEventListener('click', () => sidebar.classList.contains('open') ? closeSidebar() : openSidebar());
overlay.addEventListener('click', closeSidebar);

// ── modal ──────────────────────────────────────────────────────────────────
const backdrop  = document.getElementById('modal-backdrop');
const modalCat  = document.getElementById('modal-category');
const modalTitle = document.getElementById('modal-title');
const modalBody = document.getElementById('modal-body');

document.getElementById('modal-close').addEventListener('click', closeModal);
backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (backdrop.classList.contains('open')) closeModal();
    else closeSidebar();
  }
});

function openModal(change) {
  modalCat.textContent  = change.category;
  modalTitle.textContent = change.title;
  modalBody.innerHTML   = renderDescription(change.description);
  backdrop.classList.add('open');
}
function closeModal() { backdrop.classList.remove('open'); }

// ── markdown-lite renderer (bold + tables) ────────────────────────────────
function renderDescription(text) {
  // tables: lines starting with |
  const lines = text.split('\n');
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (line.trim().startsWith('|')) {
      // collect table lines
      const tableLines = [];
      while (i < lines.length && lines[i].trim().startsWith('|')) {
        tableLines.push(lines[i]);
        i++;
      }
      out.push(renderTable(tableLines));
    } else {
      out.push(escapeLine(line));
      i++;
    }
  }
  let html = out.join('\n');
  // bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // wrap non-table text in a span to preserve pre-wrap
  return html;
}

function renderTable(lines) {
  const rows = lines
    .filter(l => !l.trim().match(/^\|[\s\-|:]+\|?$/))  // skip separator rows
    .map(l =>
      l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim())
    );
  if (rows.length === 0) return '';
  const [header, ...body] = rows;
  const ths = header.map(h => `<th>${escapeHtml(h)}</th>`).join('');
  const trs = body.map(row =>
    '<tr>' + row.map(c => `<td>${escapeHtml(c)}</td>`).join('') + '</tr>'
  ).join('');
  return `<table class="md-table"><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table>`;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeLine(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── load & render ──────────────────────────────────────────────────────────
async function loadChanges() {
  let data;
  try {
    data = await fetch('/api/changes').then(r => r.json());
  } catch {
    document.getElementById('loading').textContent = 'Failed to load changes.';
    return;
  }
  document.getElementById('loading').style.display = 'none';

  // group by category preserving insertion order
  const categories = [];
  const catMap = {};
  for (const ch of data) {
    if (!catMap[ch.category]) {
      catMap[ch.category] = [];
      categories.push(ch.category);
    }
    catMap[ch.category].push(ch);
  }

  const container = document.getElementById('change-sections');
  for (const cat of categories) {
    const section = document.createElement('div');
    section.className = 'category-section';

    const title = document.createElement('div');
    title.className = 'category-title';
    title.textContent = cat;
    section.appendChild(title);

    const list = document.createElement('div');
    list.className = 'change-list';

    for (const ch of catMap[cat]) {
      const item = document.createElement('div');
      item.className = 'change-item';
      item.innerHTML = `
        <span class="change-item-title">${escapeHtml(ch.title)}</span>
        <svg class="change-item-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
        </svg>`;
      item.addEventListener('click', () => openModal(ch));
      list.appendChild(item);
    }

    section.appendChild(list);
    container.appendChild(section);
  }
}

loadChanges();
</script>
</body>
</html>
