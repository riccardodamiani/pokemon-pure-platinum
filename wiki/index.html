<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pure Platinum Wiki</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --accent: #e63946;
      --accent2: #457b9d;
      --text: #e8eaf0;
      --text-muted: #7a7f99;
      --sidebar-w: 260px;
      --header-h: 64px;
      --radius: 10px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── OVERLAY ─────────────────────────────────── */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition);
      z-index: 90;
    }
    #overlay.visible {
      opacity: 1;
      pointer-events: all;
    }

    /* ── SIDEBAR ─────────────────────────────────── */
    #sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--sidebar-w);
      height: 100vh;
      background: var(--surface);
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      transform: translateX(calc(-1 * var(--sidebar-w)));
      transition: transform var(--transition);
      z-index: 100;
      display: flex;
      flex-direction: column;
      padding-top: var(--header-h);
    }
    #sidebar.open {
      transform: translateX(0);
    }

    .sidebar-header {
      padding: 24px 24px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sidebar-title {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .sidebar-nav {
      padding: 12px 0;
      flex: 1;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 24px;
      color: var(--text-muted);
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: color 0.2s, background 0.2s, border-color 0.2s;
      font-size: 0.95rem;
      font-weight: 500;
      user-select: none;
      text-decoration: none;
    }
    .nav-item:hover {
      background: var(--surface2);
      color: var(--text);
      border-left-color: var(--accent);
    }
    .nav-item svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      opacity: 0.7;
    }
    .nav-item:hover svg {
      opacity: 1;
    }

    /* ── HEADER ──────────────────────────────────── */
    #header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      padding: 0 24px;
      z-index: 80;
      gap: 16px;
    }

    /* ── LOGO BUTTON ─────────────────────────────── */
    #logo-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.2s;
      flex-shrink: 0;
    }
    #logo-btn:hover {
      background: rgba(255, 255, 255, 0.07);
      transform: rotate(15deg);
    }
    #logo-btn:active {
      transform: rotate(15deg) scale(0.92);
    }

    /* Pokéball SVG colors */
    .pball-top    { fill: var(--accent); }
    .pball-bot    { fill: #d0d4e8; }
    .pball-band   { fill: #111318; }
    .pball-center { fill: #111318; stroke: #d0d4e8; stroke-width: 2.5; }
    .pball-dot    { fill: #d0d4e8; }

    #site-name {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text);
      user-select: none;
    }
    #site-name span {
      color: var(--accent);
    }

    /* ── MAIN CONTENT ────────────────────────────── */
    #main {
      padding-top: var(--header-h);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      text-align: center;
      padding: 48px 24px;
    }

    .hero-logo {
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-10px); }
    }

    .hero h1 {
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .hero h1 span { color: var(--accent); }

    .hero p {
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 400px;
      line-height: 1.6;
    }

    .quick-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      padding: 0 24px 48px;
    }

    .card {
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius);
      padding: 20px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      width: 130px;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
      user-select: none;
      text-decoration: none;
    }
    .card:hover {
      background: var(--surface2);
      border-color: var(--accent);
      transform: translateY(-3px);
    }
    .card svg { width: 28px; height: 28px; }
    .card span {
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .card:hover span { color: var(--text); }
  </style>
</head>
<body>

  <!-- Overlay -->
  <div id="overlay"></div>

  <!-- Sidebar -->
  <nav id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Navigation</span>
    </div>
    <div class="sidebar-nav">
      <a class="nav-item" href="/changes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
        Changes
      </a>
      <a class="nav-item" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/>
          <line x1="9" y1="3" x2="9" y2="18"/>
          <line x1="15" y1="6" x2="15" y2="21"/>
        </svg>
        Map
      </a>
      <a class="nav-item" href="/trainers">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Trainers
      </a>
      <a class="nav-item" href="/pokemon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        Pokémon
      </a>
      <a class="nav-item" href="/items">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
          <path d="M16 7V5a2 2 0 0 0-4 0v2"/>
          <line x1="12" y1="12" x2="12" y2="16"/>
          <line x1="10" y1="14" x2="14" y2="14"/>
        </svg>
        Items
      </a>
      <a class="nav-item" href="/moves">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        Moves
      </a>
      <a class="nav-item" href="/encounters">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <path d="M9 22V12h6v10"/>
          <circle cx="12" cy="7" r="2"/>
        </svg>
        Encounters
      </a>
    </div>
  </nav>

  <!-- Header -->
  <header id="header">
    <button id="logo-btn" aria-label="Toggle menu">
      <!-- Pokéball SVG -->
      <svg width="36" height="36" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
        <clipPath id="clip-circle">
          <circle cx="18" cy="18" r="16"/>
        </clipPath>
        <circle cx="18" cy="18" r="16" class="pball-bot"/>
        <rect x="2" y="2" width="32" height="16" class="pball-top" clip-path="url(#clip-circle)"/>
        <rect x="2" y="16" width="32" height="4" class="pball-band"/>
        <circle cx="18" cy="18" r="5" class="pball-center"/>
        <circle cx="18" cy="18" r="2.5" class="pball-dot"/>
      </svg>
    </button>
    <div id="site-name">Pure <span>Platinum</span> Wiki</div>
  </header>

  <!-- Main -->
  <main id="main">
    <div class="hero">
      <!-- Large decorative Pokéball -->
      <div class="hero-logo">
        <svg width="100" height="100" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
          <clipPath id="clip-hero">
            <circle cx="18" cy="18" r="16"/>
          </clipPath>
          <circle cx="18" cy="18" r="16" class="pball-bot" opacity="0.15"/>
          <rect x="2" y="2" width="32" height="16" class="pball-top" clip-path="url(#clip-hero)" opacity="0.3"/>
          <rect x="2" y="16" width="32" height="4" class="pball-band" opacity="0.4"/>
          <circle cx="18" cy="18" r="5" class="pball-center" opacity="0.4"/>
          <circle cx="18" cy="18" r="16" fill="none" stroke="var(--accent)" stroke-width="1.5" opacity="0.6"/>
          <circle cx="18" cy="18" r="2.5" fill="var(--accent)" opacity="0.8"/>
          <line x1="2" y1="18" x2="13" y2="18" stroke="var(--accent)" stroke-width="1.5" opacity="0.6"/>
          <line x1="23" y1="18" x2="34" y2="18" stroke="var(--accent)" stroke-width="1.5" opacity="0.6"/>
        </svg>
      </div>
      <h1>Pure <span>Platinum</span><br/>Wiki</h1>
      <p>An automatically generated reference for the Pure Platinum ROM hack. Click the Pokéball to navigate.</p>
    </div>

    <div class="quick-cards">
      <div class="card">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/>
          <line x1="9" y1="3" x2="9" y2="18"/>
          <line x1="15" y1="6" x2="15" y2="21"/>
        </svg>
        <span>Map</span>
      </div>
      <a class="card" href="/trainers">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span>Trainers</span>
      </a>
      <a class="card" href="/pokemon">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <span>Pokémon</span>
      </a>
      <a class="card" href="/items">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
          <path d="M16 7V5a2 2 0 0 0-4 0v2"/>
          <line x1="12" y1="12" x2="12" y2="16"/>
          <line x1="10" y1="14" x2="14" y2="14"/>
        </svg>
        <span>Items</span>
      </a>
      <a class="card" href="/moves">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        <span>Moves</span>
      </a>
      <a class="card" href="/changes">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
        <span>Changes</span>
      </a>
      <a class="card" href="/encounters">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <path d="M9 22V12h6v10"/>
          <circle cx="12" cy="7" r="2"/>
        </svg>
        <span>Encounters</span>
      </a>
    </div>
  </main>

  <script>
    const btn     = document.getElementById('logo-btn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    function openSidebar() {
      sidebar.classList.add('open');
      overlay.classList.add('visible');
    }

    function closeSidebar() {
      sidebar.classList.remove('open');
      overlay.classList.remove('visible');
    }

    btn.addEventListener('click', () => {
      sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
    });

    overlay.addEventListener('click', closeSidebar);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeSidebar();
    });
  </script>
</body>
</html>
