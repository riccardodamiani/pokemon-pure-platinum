<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Encounters — Pure Platinum Wiki</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0f1117;
      --surface:    #1a1d27;
      --surface2:   #22263a;
      --accent:     #e63946;
      --accent2:    #457b9d;
      --text:       #e8eaf0;
      --text-muted: #7a7f99;
      --sidebar-w:  260px;
      --header-h:   64px;
      --radius:     10px;
      --tr:         0.3s cubic-bezier(0.4,0,0.2,1);
      --land-color:  #4a7c4e;
      --water-color: #2a6496;
    }

    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; overflow-x: hidden;
    }

    /* ── SIDEBAR OVERLAY ─────────────────────────── */
    #overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      opacity: 0; pointer-events: none;
      transition: opacity var(--tr); z-index: 90;
    }
    #overlay.visible { opacity: 1; pointer-events: all; }

    /* ── SIDEBAR ─────────────────────────────────── */
    #sidebar {
      position: fixed; top: 0; left: 0;
      width: var(--sidebar-w); height: 100vh;
      background: var(--surface);
      border-right: 1px solid rgba(255,255,255,0.06);
      transform: translateX(calc(-1 * var(--sidebar-w)));
      transition: transform var(--tr);
      z-index: 100; display: flex; flex-direction: column;
      padding-top: var(--header-h);
    }
    #sidebar.open { transform: translateX(0); }
    .sidebar-header {
      padding: 24px 24px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .sidebar-title {
      font-size: 0.75rem; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-muted);
    }
    .sidebar-nav { padding: 12px 0; flex: 1; }
    .nav-item {
      display: flex; align-items: center; gap: 14px;
      padding: 13px 24px; color: var(--text-muted); cursor: pointer;
      border-left: 3px solid transparent;
      transition: color .2s, background .2s, border-color .2s;
      font-size: 0.95rem; font-weight: 500;
      text-decoration: none; user-select: none;
    }
    .nav-item:hover, .nav-item.active {
      background: var(--surface2); color: var(--text);
      border-left-color: var(--accent);
    }
    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.7; }
    .nav-item:hover svg, .nav-item.active svg { opacity: 1; }

    /* ── HEADER ──────────────────────────────────── */
    #header {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--header-h); background: var(--surface);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex; align-items: center;
      padding: 0 24px; z-index: 80; gap: 16px;
    }
    #logo-btn {
      background: none; border: none; cursor: pointer;
      padding: 6px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s, transform .2s; flex-shrink: 0;
    }
    #logo-btn:hover { background: rgba(255,255,255,.07); transform: rotate(15deg); }
    #logo-btn:active { transform: rotate(15deg) scale(.92); }
    .pball-top    { fill: #e63946; }
    .pball-bot    { fill: #d0d4e8; }
    .pball-band   { fill: #111318; }
    .pball-center { fill: #111318; stroke: #d0d4e8; stroke-width: 2.5; }
    .pball-dot    { fill: #d0d4e8; }
    #site-name {
      font-size: 1.05rem; font-weight: 700;
      letter-spacing: .04em; color: var(--text);
      text-decoration: none; user-select: none;
    }
    #site-name span { color: var(--accent); }

    /* ── MAIN ────────────────────────────────────── */
    #main {
      padding-top: calc(var(--header-h) + 28px);
      padding-bottom: 48px; max-width: 1400px;
      margin: 0 auto; padding-left: 24px; padding-right: 24px;
    }

    /* ── TOOLBAR ─────────────────────────────────── */
    .toolbar {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 16px; flex-wrap: wrap;
    }
    .toolbar h1 {
      font-size: 1.4rem; font-weight: 800;
      letter-spacing: -.01em; flex: 1;
    }
    .toolbar h1 span { color: var(--accent); }
    #search {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; color: var(--text);
      font-size: 0.9rem; padding: 8px 14px;
      outline: none; width: 220px;
      transition: border-color .2s;
    }
    #search:focus { border-color: var(--accent); }
    #search::placeholder { color: var(--text-muted); }
    #count { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; }

    /* ── TYPE FILTER ─────────────────────────────── */
    #type-filter {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-bottom: 24px;
    }
    .tf-btn {
      font-size: 0.7rem; font-weight: 700;
      letter-spacing: .07em; text-transform: uppercase;
      padding: 4px 12px; border-radius: 5px;
      border: 2px solid transparent;
      cursor: pointer; color: #fff;
      opacity: 0.5; transition: opacity .15s, border-color .15s;
      user-select: none;
    }
    .tf-btn:hover  { opacity: 0.8; }
    .tf-btn.active { opacity: 1; border-color: rgba(255,255,255,0.7); }
    .tf-land  { background: var(--land-color); }
    .tf-water { background: var(--water-color); }
    .tf-rod   { background: #8b4513; }

    /* ── GRID ────────────────────────────────────── */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }
    .enc-card {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: var(--radius);
      padding: 16px;
      display: flex; flex-direction: column; gap: 10px;
      cursor: pointer;
      transition: border-color .2s, transform .2s, background .2s;
    }
    .enc-card:hover {
      border-color: rgba(255,255,255,0.2);
      transform: translateY(-3px);
      background: var(--surface2);
    }
    .enc-name {
      font-size: 0.88rem; font-weight: 700;
      letter-spacing: .02em; color: var(--text);
      line-height: 1.3;
    }
    .enc-flags {
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    .enc-flag {
      font-size: 0.65rem; font-weight: 700; letter-spacing: .07em;
      text-transform: uppercase; padding: 2px 8px;
      border-radius: 4px; color: #fff;
    }
    .enc-flag.land  { background: var(--land-color); }
    .enc-flag.water { background: var(--water-color); }
    .enc-flag.rod   { background: #8b4513; }

    /* ── DETAIL MODAL ────────────────────────────── */
    #detail-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.72);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; opacity: 0; pointer-events: none;
      transition: opacity var(--tr);
    }
    #detail-backdrop.open { opacity: 1; pointer-events: all; }
    #detail-panel {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      width: min(900px, calc(100vw - 32px));
      max-height: calc(100vh - 48px);
      overflow-y: auto;
      padding: 28px;
      position: relative;
      transform: translateY(20px);
      transition: transform var(--tr);
    }
    #detail-backdrop.open #detail-panel { transform: translateY(0); }

    #detail-close {
      position: absolute; top: 16px; right: 16px;
      background: rgba(255,255,255,0.06);
      border: none; border-radius: 50%;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-muted);
      transition: background .2s, color .2s;
    }
    #detail-close:hover { background: rgba(255,255,255,0.12); color: var(--text); }

    .detail-header-row {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 20px; padding-right: 40px; flex-wrap: wrap;
    }
    .detail-title { font-size: 1.4rem; font-weight: 800; }

    .badge-land  { background: var(--land-color); }
    .badge-water { background: var(--water-color); }
    .badge-rod   { background: #8b4513; }

    /* ── Two-column layout ───────────────────────── */
    .detail-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    @media (max-width: 560px) {
      .detail-columns { grid-template-columns: 1fr; }
    }

    .col-label {
      font-size: 0.65rem; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; padding: 2px 9px; border-radius: 4px;
      color: #fff; display: inline-block; margin-bottom: 12px;
    }

    /* ── Land controls ───────────────────────────── */
    .land-controls { margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
    .ctrl-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .time-btn {
      font-size: 0.68rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
      padding: 3px 10px; border-radius: 5px; border: 2px solid rgba(255,255,255,0.12);
      background: transparent; color: var(--text-muted); cursor: pointer;
      transition: all .15s;
    }
    .time-btn.active { background: var(--land-color); border-color: var(--land-color); color: #fff; }
    .time-btn:hover:not(.active) { border-color: rgba(255,255,255,0.3); color: var(--text); }
    .chk-label {
      font-size: 0.75rem; font-weight: 600; color: var(--text-muted);
      display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none;
    }
    .chk-label input { accent-color: var(--land-color); width: 13px; height: 13px; }
    .chk-label:hover { color: var(--text); }

    /* ── Water tabs ────────────────────────────────────────── */
    .water-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .water-tab {
      font-size: 0.68rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
      padding: 3px 10px; border-radius: 5px; border: 2px solid rgba(255,255,255,0.12);
      background: transparent; color: var(--text-muted); cursor: pointer; transition: all .15s;
    }
    .water-tab:hover { border-color: rgba(255,255,255,0.3); color: var(--text); }
    .water-tab.active-surf { background: var(--water-color); border-color: var(--water-color); color: #fff; }
    .water-tab.active-rod  { background: #8b4513;            border-color: #8b4513;            color: #fff; }

    .enc-rate-line {
      font-size: 0.7rem; color: var(--text-muted); margin-bottom: 10px;
    }

    /* ── Rate rows ───────────────────────────────── */
    .rate-row {
      display: grid; grid-template-columns: 1fr auto auto;
      align-items: center; gap: 2px 8px;
      padding: 5px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .rate-row:last-child { border-bottom: none; }
    .rate-species { font-size: 0.82rem; font-weight: 600; }
    .rate-lvl     { font-size: 0.7rem; color: var(--text-muted); white-space: nowrap; }
    .rate-pct     { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; min-width: 34px; text-align: right; }
    .rate-bar-wrap {
      grid-column: 1 / -1;
      height: 3px; background: rgba(255,255,255,0.07); border-radius: 2px;
    }
    .rate-bar { height: 100%; border-radius: 2px; transition: width .2s; }
    .bar-land  { background: var(--land-color); }
    .bar-water { background: var(--water-color); }
    .bar-rod   { background: #8b4513; }

    /* ── Water/rod subsections ───────────────────── */
    .water-section { margin-bottom: 16px; }
    .water-section-label {
      font-size: 0.65rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      padding: 2px 8px; border-radius: 4px; color: #fff;
      display: inline-block; margin-bottom: 8px;
    }

    /* ── Pokémon detail modal ────────────────────────── */
    .type-badge { font-size:.63rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; padding:2px 7px; border-radius:4px; color:#fff; }
    .type-normal{background:#9a9a7a} .type-fire{background:#f08030} .type-water{background:#6890f0}
    .type-electric{background:#f8d030;color:#333} .type-grass{background:#78c850} .type-ice{background:#98d8d8;color:#333}
    .type-fighting{background:#c03028} .type-poison{background:#a040a0} .type-ground{background:#e0c068;color:#333}
    .type-flying{background:#a890f0} .type-psychic{background:#f85888} .type-bug{background:#a8b820}
    .type-rock{background:#b8a038} .type-ghost{background:#705898} .type-dragon{background:#7038f8}
    .type-dark{background:#705848} .type-steel{background:#b8b8d0;color:#333} .type-unknown{background:#68a090}
    #pk-backdrop {
      position:fixed; inset:0; background:rgba(0,0,0,0.72);
      display:flex; align-items:center; justify-content:center;
      z-index:300; opacity:0; pointer-events:none; transition:opacity var(--tr);
    }
    #pk-backdrop.open { opacity:1; pointer-events:all; }
    #pk-panel {
      background:var(--surface); border:1px solid rgba(255,255,255,0.08); border-radius:16px;
      width:min(1100px, calc(100vw - 32px)); max-height:calc(100vh - 48px);
      overflow-y:auto; padding:28px; position:relative;
      transform:translateY(20px); transition:transform var(--tr);
    }
    #pk-backdrop.open #pk-panel { transform:translateY(0); }
    #pk-close {
      position:absolute; top:16px; right:16px; background:rgba(255,255,255,0.06);
      border:none; border-radius:50%; width:32px; height:32px;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; color:var(--text-muted); transition:background .2s,color .2s;
    }
    #pk-close:hover { background:rgba(255,255,255,0.12); color:var(--text); }
    .detail-name { font-size:1.6rem; font-weight:800; text-transform:capitalize; margin-bottom:20px; padding-right:40px; }
    .detail-body { display:grid; grid-template-columns:1fr 1fr; gap:0; min-height:320px; }
    .detail-left { display:flex; flex-direction:column; gap:18px; padding-right:28px; border-right:1px solid rgba(255,255,255,0.07); }
    .detail-right { padding-left:28px; }
    .detail-top-row { display:flex; gap:20px; align-items:flex-start; }
    .detail-sprite-wrap canvas { image-rendering:pixelated; display:block; }
    .detail-info { flex:1; display:flex; flex-direction:column; gap:18px; }
    .section-title { font-size:0.7rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); margin-bottom:6px; }
    .stats-table { width:100%; border-collapse:collapse; font-size:0.82rem; }
    .stats-table td { padding:3px 0; }
    .stats-table .sn { color:var(--text-muted); width:30%; white-space:nowrap; padding-right:8px; }
    .stats-table .sv { font-weight:700; width:30px; text-align:right; padding-right:10px; }
    .stat-bar-wrap { width:100%; height:6px; background:rgba(255,255,255,0.08); border-radius:3px; overflow:hidden; }
    .stat-bar { height:100%; border-radius:3px; background:var(--accent2); }
    .stat-bar.hi { background:#78c850; } .stat-bar.vhi { background:#f8d030; }
    .stats-total { display:flex; justify-content:space-between; font-size:0.82rem; padding-top:6px; border-top:1px solid rgba(255,255,255,0.07); margin-top:2px; }
    .stats-total .lbl { color:var(--text-muted); font-weight:600; } .stats-total .val { font-weight:800; }
    .detail-meta { display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; }
    .evo-chain { display:flex; flex-direction:column; gap:6px; }
    .evo-entry { display:flex; align-items:center; gap:8px; font-size:0.82rem; cursor:pointer; border-radius:6px; padding:3px 6px; margin:0 -6px; transition:background .15s; }
    .evo-entry:hover { background:var(--surface2); }
    .evo-arrow { color:var(--text-muted); font-size:1rem; }
    .evo-method { font-size:0.7rem; font-weight:600; color:var(--text-muted); letter-spacing:.04em; }
    .evo-target { font-weight:700; text-transform:capitalize; }
    .meta-item { font-size:0.8rem; }
    .meta-item .mk { color:var(--text-muted); font-size:0.68rem; font-weight:600; letter-spacing:.07em; text-transform:uppercase; display:block; margin-bottom:2px; }
    .meta-item .mv { font-weight:600; }
    /* ── Move detail modal ──────────────────────────────── */
    #move-backdrop {
      position:fixed; inset:0; background:rgba(0,0,0,0.55);
      display:flex; align-items:center; justify-content:center;
      z-index:400; opacity:0; pointer-events:none; transition:opacity var(--tr);
    }
    #move-backdrop.open { opacity:1; pointer-events:all; }
    #move-panel { background:var(--surface); border:1px solid rgba(255,255,255,0.08); border-radius:16px; width:min(560px, calc(100vw - 32px)); max-height:calc(100vh - 48px); overflow-y:auto; padding:28px; position:relative; transform:translateY(20px); transition:transform var(--tr); }
    #move-backdrop.open #move-panel { transform:translateY(0); }
    #move-close { position:absolute; top:16px; right:16px; background:rgba(255,255,255,0.06); border:none; border-radius:50%; width:32px; height:32px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-muted); transition:background .2s,color .2s; }
    #move-close:hover { background:rgba(255,255,255,0.12); color:var(--text); }
    .move-detail-name { font-size:1.4rem; font-weight:800; margin-bottom:18px; padding-right:40px; }
    .move-detail-desc { font-size:0.8rem; color:var(--text-muted); line-height:1.5; margin-bottom:18px; }
    .move-detail-badges { display:grid; grid-template-columns:1fr 1fr; margin-bottom:16px; }
    .move-detail-badges .col { display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
    .move-detail-meta { display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; margin-bottom:16px; }
    .flag-badge { font-size:0.66rem; font-weight:600; padding:2px 8px; border-radius:4px; background:var(--surface2); color:#c8ccd8; letter-spacing:.04em; }
    .flags-list { display:flex; flex-wrap:wrap; gap:5px; }
    /* ── Learnset ───────────────────────────────────────────── */
    .learnset-tabs { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:14px; }
    .ls-tab { font-size:0.7rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; padding:5px 12px; border-radius:6px; border:1.5px solid rgba(255,255,255,0.12); background:none; color:var(--text-muted); cursor:pointer; transition:all .15s; }
    .ls-tab:hover { color:var(--text); border-color:rgba(255,255,255,0.3); } .ls-tab.active { background:var(--accent); border-color:var(--accent); color:#fff; } .ls-tab:disabled { opacity:0.3; cursor:default; }
    .move-table { width:100%; border-collapse:collapse; font-size:0.8rem; }
    .move-table th { text-align:left; color:var(--text-muted); font-size:0.65rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:0 8px 6px 0; border-bottom:1px solid rgba(255,255,255,0.07); }
    .move-table td { padding:5px 8px 5px 0; border-bottom:1px solid rgba(255,255,255,0.04); vertical-align:middle; }
    .move-table tr:last-child td { border-bottom:none; }
    .move-table tbody tr { cursor:pointer; transition:background .12s; } .move-table tbody tr:hover { background:var(--surface2); }
    .col-lv { color:var(--accent); font-weight:700; width:32px; } .col-tm { color:var(--text-muted); font-weight:600; font-size:0.7rem; width:38px; } .col-name { font-weight:600; } .col-pow,.col-acc { text-align:right; width:38px; color:var(--text-muted); }
    .move-class { font-size:0.62rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:2px 6px; border-radius:3px; }
    .move-class-physical{background:#c03028;color:#fff} .move-class-special{background:#6890f0;color:#fff} .move-class-status{background:#555;color:#ccc}
    /* ── Clickable species ────────────────────────────────── */
    .pk-link { cursor:pointer; text-decoration:underline; text-underline-offset:2px; text-decoration-color:rgba(255,255,255,.2); transition:color .15s,text-decoration-color .15s; }
    .pk-link:hover { color:var(--accent2); text-decoration-color:var(--accent2); }

    #loading { text-align: center; padding: 80px 0; color: var(--text-muted); }
    #empty   { display: none; text-align: center; padding: 80px 0; color: var(--text-muted); }
  </style>
</head>

<div id="overlay"></div>

<!-- ── Sidebar ──────────────────────────────────────────── -->

  <div class="sidebar-header"><span class="sidebar-title">Navigation</span></div>
  <div class="sidebar-nav">

      </svg>Home
    </a>
    <a class="nav-item" href="/changes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>Changes
    </a>
    <a class="nav-item" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

<script>
// ── sidebar ────────────────────────────────────────────────────────────────
const btn     = document.getElementById('logo-btn');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
const openSidebar  = () => { sidebar.classList.add('open');    overlay.classList.add('visible'); };
const closeSidebar = () => { sidebar.classList.remove('open'); overlay.classList.remove('visible'); };
btn.addEventListener('click', () => sidebar.classList.contains('open') ? closeSidebar() : openSidebar());
overlay.addEventListener('click', closeSidebar);

// ── species formatting ────────────────────────────────────────────────────
function fmtSpecies(s) {
  return (s || '').replace(/^SPECIES_/, '').replace(/_/g, ' ')
    .toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}

// ── type filter ───────────────────────────────────────────────────────────
let activeType = null;

document.getElementById('type-filter').addEventListener('click', e => {
  const b = e.target.closest('.tf-btn');
  if (!b) return;
  const t = b.dataset.type;
  activeType = activeType === t ? null : t;
  document.querySelectorAll('.tf-btn').forEach(x =>
    x.classList.toggle('active', x.dataset.type === activeType)
  );
  applyFilters();
});

// ── detail modal ──────────────────────────────────────────────────────────
const backdrop      = document.getElementById('detail-backdrop');
const detailContent = document.getElementById('detail-content');
document.getElementById('detail-close').addEventListener('click', closeDetail);
backdrop.addEventListener('click', e => { if (e.target === backdrop) closeDetail(); });

// open Pokémon modal when a species name is clicked inside the area detail
detailContent.addEventListener('click', e => {
  const link = e.target.closest('.pk-link');
  if (link) { e.stopPropagation(); openPkDetail(link.dataset.pk); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (backdrop.classList.contains('open')) closeDetail();
    else closeSidebar();
  }
});
function openDetail(slug) { backdrop.classList.add('open'); loadDetail(slug); }
function closeDetail()    { backdrop.classList.remove('open'); }

// ── encounter rate constants ──────────────────────────────────────────────
const SLOT_PROBS = [20, 20, 10, 10, 10, 10, 5, 5, 4, 4, 1, 1];
const SURF_PROBS = [60, 30, 5, 4, 1];
const ROD_PROBS  = { old: [60, 30, 5, 4, 1], good: [40, 40, 15, 4, 1], super: [40, 40, 15, 4, 1] };

function calcLandRates(d, timeMode, useSwarm, useRadar) {
  const base   = d.land_encounters || [];
  const slots  = base.map(e => e.species);
  const levels = base.map(e => e.level);

  if (timeMode === 'day'   && d.day?.length   >= 2) { slots[2] = d.day[0];   slots[3] = d.day[1]; }
  if (timeMode === 'night' && d.night?.length >= 2) { slots[2] = d.night[0]; slots[3] = d.night[1]; }
  if (useSwarm && d.swarms?.length >= 2) { slots[0] = d.swarms[0]; slots[1] = d.swarms[1]; }
  if (useRadar && d.radar?.length  >= 4) {
    slots[4] = d.radar[0]; slots[5] = d.radar[1]; slots[10] = d.radar[2]; slots[11] = d.radar[3];
  }

  const totals = {}, lvlSets = {};
  slots.forEach((sp, i) => {
    if (sp === 'SPECIES_NONE') return;
    totals[sp] = (totals[sp] || 0) + SLOT_PROBS[i];
    if (!lvlSets[sp]) lvlSets[sp] = new Set();
    if (levels[i] != null) lvlSets[sp].add(levels[i]);
  });
  return Object.entries(totals).sort((a, b) => b[1] - a[1]).map(([sp, pct]) => {
    const lvls = [...lvlSets[sp]].sort((a, b) => a - b);
    const lvlStr = lvls.length === 0 ? '' : lvls.length === 1 ? `Lv. ${lvls[0]}` : `Lv. ${lvls[0]}–${lvls[lvls.length-1]}`;
    return { species: sp, pct, lvlStr };
  });
}

function calcWaterRates(encounters, probs) {
  const totals = {}, lvlSets = {};
  encounters.forEach((e, i) => {
    if (e.species === 'SPECIES_NONE') return;
    totals[e.species] = (totals[e.species] || 0) + probs[i];
    if (!lvlSets[e.species]) lvlSets[e.species] = new Set();
    if (e.level_min != null) lvlSets[e.species].add(e.level_min);
    if (e.level_max != null) lvlSets[e.species].add(e.level_max);
  });
  return Object.entries(totals).sort((a, b) => b[1] - a[1]).map(([sp, pct]) => {
    const lvls = [...lvlSets[sp]].sort((a, b) => a - b);
    const lvlStr = lvls.length === 0 ? '' : lvls.length === 1 ? `Lv. ${lvls[0]}` : `Lv. ${lvls[0]}–${lvls[lvls.length-1]}`;
    return { species: sp, pct, lvlStr };
  });
}

function buildRateRows(rows, barCls) {
  if (!rows.length) return '<p style="color:var(--text-muted);font-size:.8rem">No encounters.</p>';
  return rows.map(({ species, pct, lvlStr }) => {
    const pkName = species.replace(/^SPECIES_/, '').toLowerCase();
    return `<div class="rate-row">
      <span class="rate-species pk-link" data-pk="${pkName}">${fmtSpecies(species)}</span>
      <span class="rate-lvl">${lvlStr}</span>
      <span class="rate-pct">${pct}%</span>
      <div class="rate-bar-wrap"><div class="rate-bar ${barCls}" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}

let _currentEncData = null;
let _activeWaterKey = null;

const WATER_TYPES = [
  { key: 'surf',      label: 'Surf',      rateKey: 'surf_rate',      encKey: 'surf_encounters',      probs: SURF_PROBS,      barCls: 'bar-water', tabCls: 'active-surf' },
  { key: 'old_rod',   label: 'Old Rod',   rateKey: 'old_rod_rate',   encKey: 'old_rod_encounters',   probs: ROD_PROBS.old,   barCls: 'bar-rod',   tabCls: 'active-rod'  },
  { key: 'good_rod',  label: 'Good Rod',  rateKey: 'good_rod_rate',  encKey: 'good_rod_encounters',  probs: ROD_PROBS.good,  barCls: 'bar-rod',   tabCls: 'active-rod'  },
  { key: 'super_rod', label: 'Super Rod', rateKey: 'super_rod_rate', encKey: 'super_rod_encounters', probs: ROD_PROBS.super, barCls: 'bar-rod',   tabCls: 'active-rod'  },
];

function renderLandRatesBody() {
  const d = _currentEncData;
  if (!d) return;
  const timeMode = detailContent.querySelector('.time-btn.active')?.dataset.time || 'morning';
  const useSwarm = document.getElementById('chk-swarm')?.checked || false;
  const useRadar = document.getElementById('chk-radar')?.checked || false;
  const el = document.getElementById('land-rates-body');
  if (el) el.innerHTML = buildRateRows(calcLandRates(d, timeMode, useSwarm, useRadar), 'bar-land');
}

function renderWaterBody() {
  const d = _currentEncData;
  if (!d) return;
  const el = document.getElementById('water-body');
  if (!el) return;
  const wt = WATER_TYPES.find(t => t.key === _activeWaterKey);
  if (!wt) { el.innerHTML = ''; return; }
  el.innerHTML =
    `<div class="enc-rate-line">Encounter rate: ${d[wt.rateKey]}%</div>` +
    buildRateRows(calcWaterRates(d[wt.encKey] || [], wt.probs), wt.barCls);
}

function buildWaterColumn(d) {
  const available = WATER_TYPES.filter(t => d[t.rateKey] > 0);
  if (!available.length) return '<p style="color:var(--text-muted);font-size:.8rem">No water encounters.</p>';
  const tabs = available.map(t =>
    `<button class="water-tab" data-wkey="${t.key}">${t.label}</button>`
  ).join('');
  return `<div class="water-tabs">${tabs}</div><div id="water-body"></div>`;
}

async function loadDetail(slug) {
  detailContent.innerHTML = '<p style="color:var(--text-muted);padding:20px 0">Loading…</p>';
  let d;
  try {
    d = await fetch(`/api/encounters/${slug}`).then(r => r.json());
  } catch {
    detailContent.innerHTML = '<p style="color:var(--text-muted)">Error loading data.</p>';
    return;
  }
  _currentEncData = d;

  const hasDay   = (d.day   || []).some(s => s !== 'SPECIES_NONE');
  const hasNight = (d.night || []).some(s => s !== 'SPECIES_NONE');
  const hasSwarm = (d.swarms|| []).some(s => s !== 'SPECIES_NONE');
  const hasRadar = (d.radar || []).some(s => s !== 'SPECIES_NONE');
  const hasWater = d.surf_rate > 0 || d.old_rod_rate > 0 || d.good_rod_rate > 0 || d.super_rod_rate > 0;

  const flagsHtml = [
    d.land_rate > 0  ? '<span class="enc-flag land">Land</span>'  : '',
    d.surf_rate > 0 || d.old_rod_rate > 0 || d.good_rod_rate > 0 || d.super_rod_rate > 0 ? '<span class="enc-flag water">Water</span>' : '',
  ].join('');

  const landControls = d.land_rate > 0 ? `
    <div class="ctrl-row">
      <button class="time-btn active" data-time="morning">Morning</button>
      ${hasDay   ? '<button class="time-btn" data-time="day">Day</button>'   : ''}
      ${hasNight ? '<button class="time-btn" data-time="night">Night</button>' : ''}
    </div>
    ${hasSwarm || hasRadar ? `<div class="ctrl-row">
      ${hasSwarm ? '<label class="chk-label"><input type="checkbox" id="chk-swarm"> Swarm</label>' : ''}
      ${hasRadar ? '<label class="chk-label"><input type="checkbox" id="chk-radar"> Pokéradar</label>' : ''}
    </div>` : ''}` : '';

  const landCol = d.land_rate > 0 ? `
    <div>
      <span class="col-label badge-land">Land</span>
      <div class="enc-rate-line">Encounter rate: ${d.land_rate}%</div>
      <div class="land-controls">${landControls}</div>
      <div id="land-rates-body"></div>
    </div>` : `<div><span class="col-label badge-land">Land</span><p style="color:var(--text-muted);font-size:.8rem;margin-top:8px">No land encounters.</p></div>`;

  detailContent.innerHTML = `
    <div class="detail-header-row">
      <span class="detail-title">${d.name}</span>
      <div class="enc-flags">${flagsHtml}</div>
    </div>
    <div class="detail-columns">
      ${landCol}
      <div>
        <span class="col-label badge-water">Water</span>
        ${buildWaterColumn(d)}
      </div>
    </div>`;

  renderLandRatesBody();

  // water tabs
  const available = WATER_TYPES.filter(t => d[t.rateKey] > 0);
  _activeWaterKey = available[0]?.key || null;
  detailContent.querySelectorAll('.water-tab').forEach(btn => {
    const wt = WATER_TYPES.find(t => t.key === btn.dataset.wkey);
    if (!wt) return;
    if (btn.dataset.wkey === _activeWaterKey) btn.classList.add(wt.tabCls);
    btn.addEventListener('click', () => {
      detailContent.querySelectorAll('.water-tab').forEach(b => b.className = 'water-tab');
      btn.classList.add(wt.tabCls);
      _activeWaterKey = wt.key;
      renderWaterBody();
    });
  });
  renderWaterBody();

  detailContent.querySelectorAll('.time-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      detailContent.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderLandRatesBody();
    });
  });
  ['chk-swarm', 'chk-radar'].forEach(id =>
    document.getElementById(id)?.addEventListener('change', renderLandRatesBody)
  );
}

// ── Pokémon detail modal ──────────────────────────────────────────────

function fmtConst(s) {
  return (s || '').replace(/^[A-Z]+?_/, '').replace(/_/g, ' ')
    .toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}

const TYPE_RE = /^TYPE_(.+)$/;
function typeKey(raw)   { const m = raw.match(TYPE_RE); return m ? m[1].toLowerCase() : 'unknown'; }
function typeLabel(raw) { const k = typeKey(raw); return k.charAt(0).toUpperCase() + k.slice(1); }
function typeClass(raw) { return 'type-' + typeKey(raw); }
function typeBadge(raw) {
  const el = document.createElement('span');
  el.className = 'type-badge ' + typeClass(raw);
  el.textContent = typeLabel(raw);
  return el;
}

function classBadge(cls) {
  const map = { CLASS_PHYSICAL: 'physical', CLASS_SPECIAL: 'special', CLASS_STATUS: 'status' };
  const k = map[cls] || 'status';
  return `<span class="move-class move-class-${k}">${k.charAt(0).toUpperCase()+k.slice(1)}</span>`;
}

function makeSpriteCanvas(url, scale = 1) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const halfW = Math.floor(img.naturalWidth / 2);
      const c = document.createElement('canvas');
      c.width = halfW; c.height = img.naturalHeight;
      c.getContext('2d').drawImage(img, 0, 0);
      c.style.width  = (halfW             * scale) + 'px';
      c.style.height = (img.naturalHeight * scale) + 'px';
      resolve(c);
    };
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

const STAT_LABELS = { hp:'HP', attack:'Atk', defense:'Def', special_attack:'SpA', special_defense:'SpD', speed:'Spe' };
const STAT_MAX = 255;
function statBarCls(v) { return v >= 130 ? 'hi vhi' : v >= 90 ? 'hi' : ''; }

function buildStatsBlock(stats) {
  const wrap = document.createElement('div');
  const title = document.createElement('div');
  title.className = 'section-title'; title.textContent = 'Base Stats';
  wrap.appendChild(title);
  const table = document.createElement('table');
  table.className = 'stats-table';
  let total = 0;
  for (const [key, label] of Object.entries(STAT_LABELS)) {
    const v = stats[key] ?? 0; total += v;
    const pct = Math.round((v / STAT_MAX) * 100);
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="sn">${label}</td><td class="sv">${v}</td><td><div class="stat-bar-wrap"><div class="stat-bar ${statBarCls(v)}" style="width:${pct}%"></div></div></td>`;
    table.appendChild(tr);
  }
  wrap.appendChild(table);
  const tot = document.createElement('div'); tot.className = 'stats-total';
  tot.innerHTML = `<span class="lbl">Total</span><span class="val">${total}</span>`;
  wrap.appendChild(tot);
  return wrap;
}

const LEARNSET_TABS = [
  { key: 'by_level', label: 'By Level' }, { key: 'by_tm', label: 'TM / HM' },
  { key: 'by_tutor', label: 'Tutor'    }, { key: 'egg_moves', label: 'Egg'  },
];

function buildLearnsetPanel(learnset) {
  const wrap = document.createElement('div');
  const title = document.createElement('div'); title.className = 'section-title'; title.textContent = 'Learnset';
  wrap.appendChild(title);
  const tabBar = document.createElement('div'); tabBar.className = 'learnset-tabs';
  const tableWrap = document.createElement('div');
  function showTab(key) {
    tabBar.querySelectorAll('.ls-tab').forEach(b => b.classList.toggle('active', b.dataset.key === key));
    tableWrap.innerHTML = '';
    const moves = learnset[key] || [];
    if (!moves.length) { tableWrap.innerHTML = '<p style="color:var(--text-muted);font-size:0.8rem;padding:8px 0">None</p>'; return; }
    const table = document.createElement('table'); table.className = 'move-table';
    const thead = document.createElement('thead');
    let thHTML = '';
    if (key === 'by_level') thHTML += '<th class="col-lv">Lv</th>';
    if (key === 'by_tm')    thHTML += '<th class="col-tm">TM</th>';
    thHTML += '<th class="col-name">Move</th><th>Type</th><th>Cat</th><th class="col-pow">Pow</th><th class="col-acc">Acc</th>';
    thead.innerHTML = `<tr>${thHTML}</tr>`; table.appendChild(thead);
    const tbody = document.createElement('tbody');
    moves.forEach(m => {
      const tr = document.createElement('tr');
      let html = '';
      if (key === 'by_level') html += `<td class="col-lv">${m.level}</td>`;
      if (key === 'by_tm')    html += `<td class="col-tm">${m.tm}</td>`;
      html += `<td class="col-name">${m.name ?? '—'}</td>`;
      html += `<td>${m.type ? `<span class="type-badge ${typeClass(m.type)}">${typeLabel(m.type)}</span>` : '—'}</td>`;
      html += `<td>${m.class ? classBadge(m.class) : '—'}</td>`;
      html += `<td class="col-pow">${m.power || '—'}</td><td class="col-acc">${m.accuracy || '—'}</td>`;
      tr.innerHTML = html;
      if (m.slug) tr.addEventListener('click', () => openMoveDetail(m.slug));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody); tableWrap.appendChild(table);
  }
  LEARNSET_TABS.forEach(({ key, label }) => {
    const btn = document.createElement('button'); btn.className = 'ls-tab'; btn.dataset.key = key; btn.textContent = label;
    if (!(learnset[key] || []).length) btn.disabled = true;
    btn.addEventListener('click', () => showTab(key)); tabBar.appendChild(btn);
  });
  wrap.appendChild(tabBar); wrap.appendChild(tableWrap);
  const first = LEARNSET_TABS.find(({ key }) => (learnset[key] || []).length > 0);
  if (first) showTab(first.key);
  return wrap;
}

function fmtEvoMethod(method, value) {
  const item = () => fmtConst(String(value));
  switch (method) {
    case 'EVO_LEVEL':                     return `Lv. ${value}`;
    case 'EVO_LEVEL_MALE':                return `Lv. ${value} (Male)`;
    case 'EVO_LEVEL_FEMALE':              return `Lv. ${value} (Female)`;
    case 'EVO_LEVEL_DAY':                 return `Lv. ${value} (Day)`;
    case 'EVO_LEVEL_NIGHT':               return `Lv. ${value} (Night)`;
    case 'EVO_LEVEL_HAPPINESS':           return 'Happiness';
    case 'EVO_LEVEL_HAPPINESS_DAY':       return 'Happiness (Day)';
    case 'EVO_LEVEL_HAPPINESS_NIGHT':     return 'Happiness (Night)';
    case 'EVO_LEVEL_ATK_GT_DEF':          return `Lv. ${value} (Atk > Def)`;
    case 'EVO_LEVEL_ATK_EQ_DEF':          return `Lv. ${value} (Atk = Def)`;
    case 'EVO_LEVEL_ATK_LT_DEF':          return `Lv. ${value} (Atk < Def)`;
    case 'EVO_LEVEL_WITH_HELD_ITEM':      return `Lv. up w/ ${item()}`;
    case 'EVO_LEVEL_WITH_HELD_ITEM_DAY':  return `Lv. up w/ ${item()} (Day)`;
    case 'EVO_LEVEL_WITH_HELD_ITEM_NIGHT':return `Lv. up w/ ${item()} (Night)`;
    case 'EVO_LEVEL_KNOW_MOVE':           return `Lv. up knowing ${item()}`;
    case 'EVO_LEVEL_MAGNETIC_FIELD':      return 'Lv. up (Magnetic Field)';
    case 'EVO_LEVEL_MOSS_ROCK':           return 'Lv. up (Moss Rock)';
    case 'EVO_LEVEL_ICE_ROCK':            return 'Lv. up (Ice Rock)';
    case 'EVO_USE_ITEM':                  return `Use ${item()}`;
    case 'EVO_USE_ITEM_MALE':             return `Use ${item()} (Male)`;
    case 'EVO_USE_ITEM_FEMALE':           return `Use ${item()} (Female)`;
    case 'EVO_TRADE':                     return 'Trade';
    case 'EVO_TRADE_WITH_HELD_ITEM':      return `Trade w/ ${item()}`;
    default:                              return fmtConst(method) + (value ? ` ${value}` : '');
  }
}

// ── Pokémon detail open/close ───────────────────────────────────────
const pkBackdrop = document.getElementById('pk-backdrop');
const pkName     = document.getElementById('pk-name');
const pkSprite   = document.getElementById('pk-sprite');
const pkStats    = document.getElementById('pk-stats');
const pkTypes    = document.getElementById('pk-types');
const pkEvo      = document.getElementById('pk-evo');
const pkMisc     = document.getElementById('pk-misc');
const pkRight    = document.getElementById('pk-right');
document.getElementById('pk-close').addEventListener('click', closePkDetail);
pkBackdrop.addEventListener('click', e => { if (e.target === pkBackdrop) closePkDetail(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('move-backdrop').classList.contains('open')) closeMoveDetail();
    else if (pkBackdrop.classList.contains('open')) closePkDetail();
    else if (backdrop.classList.contains('open')) closeDetail();
    else closeSidebar();
  }
});
function openPkDetail(name) { pkBackdrop.classList.add('open'); loadPkDetail(name); }
function closePkDetail()    { pkBackdrop.classList.remove('open'); }

async function loadPkDetail(name) {
  pkName.textContent = '…';
  pkSprite.innerHTML = pkStats.innerHTML = pkTypes.innerHTML = pkEvo.innerHTML = pkMisc.innerHTML = pkRight.innerHTML = '';
  let d;
  try { d = await fetch(`/api/pokemon/${name}`).then(r => r.json()); }
  catch { pkName.textContent = 'Error loading data'; return; }

  pkName.textContent = name.replace(/-/g, ' ');

  const sprCanvas = await makeSpriteCanvas(`/sprites/${name}/male`, 2.8)
    ?? await makeSpriteCanvas(`/sprites/${name}/female`, 2.8);
  if (sprCanvas) { pkSprite.appendChild(sprCanvas); pkStats.style.height = sprCanvas.style.height; }

  if (d.base_stats) pkStats.appendChild(buildStatsBlock(d.base_stats));
  const entryLines = d.pokedex_data?.en?.entry_text;
  if (entryLines) {
    const p = document.createElement('p');
    p.style.cssText = 'font-size:0.8rem;color:var(--text-muted);line-height:1.5;margin-top:8px;';
    p.textContent = entryLines.join('').replace(/\n/g, ' ').trim();
    pkStats.appendChild(p);
  }

  const types = [...new Set(d.types || [])];
  const typesTitle = document.createElement('div'); typesTitle.className = 'section-title'; typesTitle.textContent = 'Type';
  pkTypes.appendChild(typesTitle);
  const typesBadges = document.createElement('div'); typesBadges.className = 'types'; typesBadges.style.cssText = 'display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-start;';
  types.forEach(t => typesBadges.appendChild(typeBadge(t))); pkTypes.appendChild(typesBadges);

  const evoRow = document.createElement('div');
  evoRow.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:flex-start;';
  const evos = d.evolutions || [];
  if (evos.length) {
    const evoWrap = document.createElement('div');
    const evoTitle = document.createElement('div'); evoTitle.className = 'section-title'; evoTitle.textContent = 'Evolution';
    evoWrap.appendChild(evoTitle);
    const chain = document.createElement('div'); chain.className = 'evo-chain';
    evos.forEach(evo => {
      const method = evo[0], target = evo[evo.length - 1], value = evo.length === 3 ? evo[1] : null;
      const targetFolder = target.replace(/^SPECIES_/, '').toLowerCase();
      const targetStr = targetFolder.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      const entry = document.createElement('div'); entry.className = 'evo-entry';
      entry.innerHTML = `<span class="evo-arrow">→</span><span class="evo-target">${targetStr}</span><span class="evo-method">(${fmtEvoMethod(method, value)})</span>`;
      entry.addEventListener('click', () => loadPkDetail(targetFolder));
      chain.appendChild(entry);
    });
    evoWrap.appendChild(chain); evoRow.appendChild(evoWrap);
  } else {
    evoRow.appendChild(document.createElement('div'));
  }
  const offspring = d.offspring || '';
  const offSelf = offspring.replace(/^SPECIES_/, '').toLowerCase() === name;
  if (offspring && offspring !== 'SPECIES_NONE' && !offSelf) {
    const offFolder = offspring.replace(/^SPECIES_/, '').toLowerCase();
    const offStr = offFolder.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    const offWrap = document.createElement('div');
    const offTitle = document.createElement('div'); offTitle.className = 'section-title'; offTitle.textContent = 'Offspring'; offWrap.appendChild(offTitle);
    const offEntry = document.createElement('div'); offEntry.className = 'evo-entry';
    offEntry.innerHTML = `<span class="evo-target">${offStr}</span>`;
    offEntry.addEventListener('click', () => loadPkDetail(offFolder));
    offWrap.appendChild(offEntry); evoRow.appendChild(offWrap);
  }
  if (evoRow.children.length) pkEvo.appendChild(evoRow);

  const miscTitle = document.createElement('div'); miscTitle.className = 'section-title'; miscTitle.textContent = 'Info'; pkMisc.appendChild(miscTitle);
  const abilities = (d.abilities || []).filter(a => a !== 'ABILITY_NONE').map(fmtConst);
  const eggGroups = [...new Set((d.egg_groups || []).filter(g => g !== 'EGG_GROUP_NONE').map(fmtConst))];
  const rows = [
    ['Abilities', abilities.join(', ') || '—'], ['Egg Groups', eggGroups.join(', ') || '—'],
    ['Catch Rate', d.catch_rate ?? '—'], ['Base Exp', d.base_exp_reward ?? '—'],
    ['Hatch Cycles', d.hatch_cycles ?? '—'], ['Friendship', d.base_friendship ?? '—'],
    ['Exp Rate', fmtConst(d.exp_rate || '') || '—'], ['Gender', fmtConst(d.gender_ratio || '') || '—'],
  ];
  const meta = document.createElement('div'); meta.className = 'detail-meta';
  rows.forEach(([k, v]) => {
    const item = document.createElement('div'); item.className = 'meta-item';
    item.innerHTML = `<span class="mk">${k}</span><span class="mv">${v}</span>`;
    meta.appendChild(item);
  });
  pkMisc.appendChild(meta);
  if (d.learnset_resolved) pkRight.appendChild(buildLearnsetPanel(d.learnset_resolved));
}

// ── Move detail ───────────────────────────────────────────────────
const moveBackdrop = document.getElementById('move-backdrop');
const moveContent  = document.getElementById('move-content');
document.getElementById('move-close').addEventListener('click', closeMoveDetail);
moveBackdrop.addEventListener('click', e => { if (e.target === moveBackdrop) closeMoveDetail(); });
function openMoveDetail(slug) { moveBackdrop.classList.add('open'); loadMoveDetail(slug); }
function closeMoveDetail()    { moveBackdrop.classList.remove('open'); }

async function loadMoveDetail(slug) {
  moveContent.innerHTML = '<p style="color:var(--text-muted);padding:20px 0">Loading…</p>';
  let d;
  try { d = await fetch(`/api/moves/${slug}`).then(r => r.json()); }
  catch { moveContent.innerHTML = '<p style="color:var(--text-muted)">Error loading data.</p>'; return; }
  const desc = (d.description || []).join('').replace(/\n/g, ' ').trim();
  const priorityStr = d.priority > 0 ? `+${d.priority}` : `${d.priority ?? 0}`;
  const effectVal = d.effect ? fmtConst(d.effect.type) + (d.effect.chance ? ` (${d.effect.chance}%)` : '') : '';
  const contestVal = d.contest ? fmtConst(d.contest.type) : '';
  const flags = (d.flags || []).map(f => `<span class="flag-badge">${fmtConst(f)}</span>`).join('');
  moveContent.innerHTML = `
    <div class="move-detail-name">${d.name || slug}</div>
    ${desc ? `<div class="move-detail-desc">${desc}</div>` : ''}
    <div class="move-detail-badges">
      <div class="col"><div class="section-title">Type</div>${d.type ? `<span class="type-badge ${typeClass(d.type)}">${typeLabel(d.type)}</span>` : '—'}</div>
      <div class="col"><div class="section-title">Class</div>${d.class ? classBadge(d.class) : '—'}</div>
    </div>
    <div class="section-title">Stats</div>
    <div class="move-detail-meta">
      <div class="meta-item"><span class="mk">Power</span>   <span class="mv">${d.power || '—'}</span></div>
      <div class="meta-item"><span class="mk">Accuracy</span><span class="mv">${d.accuracy ? d.accuracy+'%' : '—'}</span></div>
      <div class="meta-item"><span class="mk">PP</span>      <span class="mv">${d.pp ?? '—'}</span></div>
      <div class="meta-item"><span class="mk">Priority</span><span class="mv">${priorityStr}</span></div>
      <div class="meta-item"><span class="mk">Range</span>   <span class="mv">${fmtConst(d.range) || '—'}</span></div>
      ${effectVal  ? `<div class="meta-item"><span class="mk">Effect</span>  <span class="mv">${effectVal}</span></div>` : ''}
      ${contestVal ? `<div class="meta-item"><span class="mk">Contest</span><span class="mv">${contestVal}</span></div>` : ''}
    </div>
    ${flags ? `<div class="section-title" style="margin-bottom:8px">Flags</div><div class="flags-list">${flags}</div>` : ''}`;
}

// ── card builder ──────────────────────────────────────────────────────────
function buildCard(area) {
  const card = document.createElement('div');
  card.className = 'enc-card';
  card.addEventListener('click', () => openDetail(area.slug));

  const nameEl = document.createElement('div');
  nameEl.className = 'enc-name';
  nameEl.textContent = area.name;
  card.appendChild(nameEl);

  const flags = document.createElement('div');
  flags.className = 'enc-flags';
  if (area.has_land) {
    const f = document.createElement('span');
    f.className = 'enc-flag land';
    f.textContent = 'Land';
    flags.appendChild(f);
  }
  if (area.has_water) {
    const f = document.createElement('span');
    f.className = 'enc-flag water';
    f.textContent = 'Water';
    flags.appendChild(f);
  }
  if (flags.childElementCount > 0) card.appendChild(flags);

  return card;
}

// ── filter + render ───────────────────────────────────────────────────────
let allAreas = [];
const grid    = document.getElementById('grid');
const loading = document.getElementById('loading');
const empty   = document.getElementById('empty');
const countEl = document.getElementById('count');
const search  = document.getElementById('search');

function applyFilters() {
  const q = search.value.trim().toLowerCase();
  let list = allAreas;
  if (q)                      list = list.filter(a => a.name.toLowerCase().includes(q));
  if (activeType === 'land')  list = list.filter(a => a.has_land);
  if (activeType === 'water') list = list.filter(a => a.has_water);
  render(list);
}

function render(list) {
  grid.innerHTML = '';
  empty.style.display = list.length === 0 ? 'block' : 'none';
  countEl.textContent = `${list.length} areas`;
  list.forEach(area => grid.appendChild(buildCard(area)));
}

fetch('/api/encounters')
  .then(r => r.json())
  .then(data => {
    allAreas = data;
    loading.style.display = 'none';
    render(allAreas);
  })
  .catch(() => { loading.textContent = 'Failed to load data. Is the server running?'; });

search.addEventListener('input', applyFilters);
</script>
