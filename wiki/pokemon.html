<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokémon — Pure Platinum Wiki</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0f1117;
      --surface:    #1a1d27;
      --surface2:   #22263a;
      --accent:     #e63946;
      --accent2:    #457b9d;
      --text:       #e8eaf0;
      --text-muted: #7a7f99;
      --sidebar-w:  260px;
      --header-h:   64px;
      --radius:     10px;
      --tr:         0.3s cubic-bezier(0.4,0,0.2,1);
    }

    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; overflow-x: hidden;
    }

    /* ── SIDEBAR OVERLAY ─────────────────────────── */
    #overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      opacity: 0; pointer-events: none;
      transition: opacity var(--tr); z-index: 90;
    }
    #overlay.visible { opacity: 1; pointer-events: all; }

    /* ── SIDEBAR ─────────────────────────────────── */
    #sidebar {
      position: fixed; top: 0; left: 0;
      width: var(--sidebar-w); height: 100vh;
      background: var(--surface);
      border-right: 1px solid rgba(255,255,255,0.06);
      transform: translateX(calc(-1 * var(--sidebar-w)));
      transition: transform var(--tr);
      z-index: 100; display: flex; flex-direction: column;
      padding-top: var(--header-h);
    }
    #sidebar.open { transform: translateX(0); }
    .sidebar-header {
      padding: 24px 24px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .sidebar-title {
      font-size: 0.75rem; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-muted);
    }
    .sidebar-nav { padding: 12px 0; flex: 1; }
    .nav-item {
      display: flex; align-items: center; gap: 14px;
      padding: 13px 24px; color: var(--text-muted); cursor: pointer;
      border-left: 3px solid transparent;
      transition: color .2s, background .2s, border-color .2s;
      font-size: 0.95rem; font-weight: 500;
      text-decoration: none; user-select: none;
    }
    .nav-item:hover, .nav-item.active {
      background: var(--surface2); color: var(--text);
      border-left-color: var(--accent);
    }
    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.7; }
    .nav-item:hover svg, .nav-item.active svg { opacity: 1; }

    /* ── HEADER ──────────────────────────────────── */
    #header {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--header-h); background: var(--surface);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex; align-items: center;
      padding: 0 24px; z-index: 80; gap: 16px;
    }
    #logo-btn {
      background: none; border: none; cursor: pointer;
      padding: 6px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s, transform .2s; flex-shrink: 0;
    }
    #logo-btn:hover { background: rgba(255,255,255,.07); transform: rotate(15deg); }
    #logo-btn:active { transform: rotate(15deg) scale(.92); }
    .pball-top    { fill: #e63946; }
    .pball-bot    { fill: #d0d4e8; }
    .pball-band   { fill: #111318; }
    .pball-center { fill: #111318; stroke: #d0d4e8; stroke-width: 2.5; }
    .pball-dot    { fill: #d0d4e8; }
    #site-name {
      font-size: 1.05rem; font-weight: 700;
      letter-spacing: .04em; color: var(--text);
      text-decoration: none; user-select: none;
    }
    #site-name span { color: var(--accent); }

    /* ── MAIN ────────────────────────────────────── */
    #main {
      padding-top: calc(var(--header-h) + 28px);
      padding-bottom: 48px; max-width: 1400px;
      margin: 0 auto; padding-left: 24px; padding-right: 24px;
    }

    /* ── TOOLBAR ─────────────────────────────────── */
    .toolbar {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 16px; flex-wrap: wrap;
    }
    .toolbar h1 {
      font-size: 1.4rem; font-weight: 800;
      letter-spacing: -.01em; flex: 1;
    }
    .toolbar h1 span { color: var(--accent); }
    #search {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; color: var(--text);
      font-size: 0.9rem; padding: 8px 14px;
      outline: none; width: 220px;
      transition: border-color .2s;
    }
    #search:focus { border-color: var(--accent); }
    #search::placeholder { color: var(--text-muted); }
    #count { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; }

    /* ── TYPE FILTER ─────────────────────────────── */
    #type-filter {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-bottom: 24px;
    }
    .tf-btn {
      font-size: 0.7rem; font-weight: 700;
      letter-spacing: .07em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 5px;
      border: 2px solid transparent;
      cursor: pointer; color: #fff;
      opacity: 0.5; transition: opacity .15s, border-color .15s;
      user-select: none;
    }
    .tf-btn:hover  { opacity: 0.8; }
    .tf-btn.active { opacity: 1; border-color: rgba(255,255,255,0.7); }

    /* ── GRID ────────────────────────────────────── */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }
    .pk-card {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: var(--radius);
      padding: 14px 12px 12px;
      display: flex; flex-direction: column;
      align-items: center; gap: 8px;
      cursor: pointer;
      transition: border-color .2s, transform .2s, background .2s;
    }
    .pk-card:hover {
      border-color: rgba(255,255,255,0.2);
      transform: translateY(-3px);
      background: var(--surface2);
    }
    .pk-name {
      font-size: 0.8rem; font-weight: 700;
      letter-spacing: .03em; text-transform: capitalize;
      color: var(--text); text-align: center;
    }
    .sprite-col { display: flex; flex-direction: column; align-items: center; }
    .sprite-col canvas { image-rendering: pixelated; display: block; }
    .types { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
    .type-badge {
      font-size: 0.63rem; font-weight: 700;
      letter-spacing: .07em; text-transform: uppercase;
      padding: 2px 7px; border-radius: 4px; color: #fff;
    }

    /* ── TYPE COLORS ─────────────────────────────── */
    .type-normal   { background: #9a9a7a; }
    .type-fire     { background: #f08030; }
    .type-water    { background: #6890f0; }
    .type-electric { background: #f8d030; color: #333; }
    .type-grass    { background: #78c850; }
    .type-ice      { background: #98d8d8; color: #333; }
    .type-fighting { background: #c03028; }
    .type-poison   { background: #a040a0; }
    .type-ground   { background: #e0c068; color: #333; }
    .type-flying   { background: #a890f0; }
    .type-psychic  { background: #f85888; }
    .type-bug      { background: #a8b820; }
    .type-rock     { background: #b8a038; }
    .type-ghost    { background: #705898; }
    .type-dragon   { background: #7038f8; }
    .type-dark     { background: #705848; }
    .type-steel    { background: #b8b8d0; color: #333; }
    .type-unknown  { background: #68a090; }

    /* ── DETAIL MODAL ────────────────────────────── */
    #detail-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.72);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; opacity: 0; pointer-events: none;
      transition: opacity var(--tr);
    }
    #detail-backdrop.open { opacity: 1; pointer-events: all; }

    /* ── MOVE DETAIL MODAL (above pokemon modal) ─── */
    #move-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 300; opacity: 0; pointer-events: none;
      transition: opacity var(--tr);
    }
    #move-backdrop.open { opacity: 1; pointer-events: all; }
    #move-panel {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      width: min(560px, calc(100vw - 32px));
      max-height: calc(100vh - 48px);
      overflow-y: auto; padding: 28px; position: relative;
      transform: translateY(20px); transition: transform var(--tr);
    }
    #move-backdrop.open #move-panel { transform: translateY(0); }
    #move-close {
      position: absolute; top: 16px; right: 16px;
      background: rgba(255,255,255,0.06); border: none; border-radius: 50%;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-muted);
      transition: background .2s, color .2s;
    }
    #move-close:hover { background: rgba(255,255,255,0.12); color: var(--text); }
    .move-detail-name { font-size: 1.4rem; font-weight: 800; margin-bottom: 18px; padding-right: 40px; }
    .move-detail-desc { font-size: 0.8rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 18px; }
    .move-detail-badges { display: grid; grid-template-columns: 1fr 1fr; margin-bottom: 16px; }
    .move-detail-badges .col { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
    .move-detail-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; margin-bottom: 16px; }
    .move-detail-meta .meta-item { font-size: 0.8rem; }
    .move-detail-meta .meta-item .mk {
      color: var(--text-muted); font-size: 0.68rem; font-weight: 600;
      letter-spacing: .07em; text-transform: uppercase; display: block; margin-bottom: 2px;
    }
    .move-detail-meta .meta-item .mv { font-weight: 600; }
    .flags-list { display: flex; flex-wrap: wrap; gap: 5px; }
    .flag-badge {
      font-size: 0.66rem; font-weight: 600; padding: 2px 8px; border-radius: 4px;
      background: var(--surface2); color: #c8ccd8; letter-spacing: .04em;
    }

    /* clickable learnset row */
    .move-table tbody tr { cursor: pointer; transition: background .12s; }
    .move-table tbody tr:hover { background: var(--surface2); }

    #detail-panel {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      width: min(1200px, calc(100vw - 32px));
      max-height: calc(100vh - 48px);
      overflow-y: auto;
      padding: 28px;
      position: relative;
      transform: translateY(20px);
      transition: transform var(--tr);
    }
    #detail-backdrop.open #detail-panel { transform: translateY(0); }

    #detail-close {
      position: absolute; top: 16px; right: 16px;
      background: rgba(255,255,255,0.06);
      border: none; border-radius: 50%;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-muted);
      transition: background .2s, color .2s;
    }
    #detail-close:hover { background: rgba(255,255,255,0.12); color: var(--text); }

    .detail-name {
      font-size: 1.6rem; font-weight: 800;
      text-transform: capitalize; margin-bottom: 20px;
      padding-right: 40px;
    }

    /* two-column body: left=info, right=future */
    .detail-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      min-height: 320px;
    }
    .detail-left {
      display: flex; flex-direction: column; gap: 18px;
      padding-right: 28px;
      border-right: 1px solid rgba(255,255,255,0.07);
    }
    .detail-right {
      padding-left: 28px;
    }

    /* sprite + stats side by side inside left column */
    .detail-top-row {
      display: flex; gap: 20px; align-items: flex-start;
    }
    .detail-sprite-wrap { flex-shrink: 0; }
    .detail-sprite-wrap canvas { image-rendering: pixelated; display: block; }

    .detail-info { flex: 1; display: flex; flex-direction: column; gap: 18px; }

    .section-title {
      font-size: 0.7rem; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 6px;
    }

    .stats-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .stats-table td { padding: 3px 0; }
    .stats-table .sn { color: var(--text-muted); width: 30%; white-space: nowrap; padding-right: 8px; }
    .stats-table .sv { font-weight: 700; width: 30px; text-align: right; padding-right: 10px; }
    .stat-bar-wrap { width: 100%; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
    .stat-bar { height: 100%; border-radius: 3px; background: var(--accent2); }
    .stat-bar.hi  { background: #78c850; }
    .stat-bar.vhi { background: #f8d030; }
    .stats-total {
      display: flex; justify-content: space-between;
      font-size: 0.82rem; padding-top: 6px;
      border-top: 1px solid rgba(255,255,255,0.07);
      margin-top: 2px;
    }
    .stats-total .lbl { color: var(--text-muted); font-weight: 600; }
    .stats-total .val { font-weight: 800; }

    .detail-meta {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px 16px;
    }

    /* evolution chain */
    .evo-chain { display: flex; flex-direction: column; gap: 6px; }
    .evo-entry {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.82rem; cursor: pointer; border-radius: 6px;
      padding: 3px 6px; margin: 0 -6px;
      transition: background .15s;
    }
    .evo-entry:hover { background: var(--surface2); }
    .evo-arrow { color: var(--text-muted); font-size: 1rem; }
    .evo-method {
      font-size: 0.7rem; font-weight: 600;
      color: var(--text-muted); letter-spacing: .04em;
    }
    .evo-target {
      font-weight: 700; text-transform: capitalize;
    }
    .meta-item { font-size: 0.8rem; }
    .meta-item .mk {
      color: var(--text-muted); font-size: 0.68rem; font-weight: 600;
      letter-spacing: .07em; text-transform: uppercase;
      display: block; margin-bottom: 2px;
    }
    .meta-item .mv { font-weight: 600; }

    #loading { text-align: center; padding: 80px 0; color: var(--text-muted); }
    #empty   { display: none; text-align: center; padding: 80px 0; color: var(--text-muted); }

    /* ── LEARNSET ────────────────────────────────── */
    .learnset-tabs {
      display: flex; gap: 4px; flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .ls-tab {
      font-size: 0.7rem; font-weight: 700;
      letter-spacing: .07em; text-transform: uppercase;
      padding: 5px 12px; border-radius: 6px;
      border: 1.5px solid rgba(255,255,255,0.12);
      background: none; color: var(--text-muted);
      cursor: pointer; transition: all .15s;
    }
    .ls-tab:hover  { color: var(--text); border-color: rgba(255,255,255,0.3); }
    .ls-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .ls-tab:disabled { opacity: 0.3; cursor: default; }

    .move-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .move-table th {
      text-align: left; color: var(--text-muted);
      font-size: 0.65rem; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
      padding: 0 8px 6px 0; border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .move-table td {
      padding: 5px 8px 5px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      vertical-align: middle;
    }
    .move-table tr:last-child td { border-bottom: none; }
    .move-table .col-lv  { color: var(--accent); font-weight: 700; width: 32px; }
    .move-table .col-tm  { color: var(--text-muted); font-weight: 600; font-size: 0.7rem; width: 38px; }
    .move-table .col-name { font-weight: 600; }
    .move-table .col-pow,
    .move-table .col-acc  { text-align: right; width: 38px; color: var(--text-muted); }
    .move-class {
      font-size: 0.62rem; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; padding: 2px 6px; border-radius: 3px;
    }
    .move-class-physical { background: #c03028; color: #fff; }
    .move-class-special  { background: #6890f0; color: #fff; }
    .move-class-status   { background: #555; color: #ccc; }
  </style>
</head>
<body>

<div id="overlay"></div>

<!-- ── Sidebar ──────────────────────────────────────────── -->
<nav id="sidebar">
  <div class="sidebar-header"><span class="sidebar-title">Navigation</span></div>
  <div class="sidebar-nav">
    <a class="nav-item" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
      </svg>Home
    </a>
    <a class="nav-item" href="/changes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>Changes
    </a>
    <a class="nav-item" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/>
        <line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/>
      </svg>Map
    </a>
    <a class="nav-item" href="/trainers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>Trainers
    </a>
    <a class="nav-item active" href="/pokemon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="2" y1="12" x2="22" y2="12"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>Pokémon
    </a>
    <a class="nav-item" href="/items">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
        <path d="M16 7V5a2 2 0 0 0-4 0v2"/>
        <line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/>
      </svg>Items
    </a>
    <a class="nav-item" href="/moves">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>Moves
    </a>
  </div>
</nav>

<!-- ── Header ───────────────────────────────────────────── -->
<header id="header">
  <button id="logo-btn" aria-label="Toggle menu">
    <svg width="36" height="36" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
      <clipPath id="clip-circle"><circle cx="18" cy="18" r="16"/></clipPath>
      <circle cx="18" cy="18" r="16" class="pball-bot"/>
      <rect x="2" y="2" width="32" height="16" class="pball-top" clip-path="url(#clip-circle)"/>
      <rect x="2" y="16" width="32" height="4" class="pball-band"/>
      <circle cx="18" cy="18" r="5" class="pball-center"/>
      <circle cx="18" cy="18" r="2.5" class="pball-dot"/>
    </svg>
  </button>
  <a id="site-name" href="/">Pure <span>Platinum</span> Wiki</a>
</header>

<!-- ── Main ─────────────────────────────────────────────── -->
<main id="main">
  <div class="toolbar">
    <h1>Pokémon <span>Pokédex</span></h1>
    <input id="search" type="text" placeholder="Search…" autocomplete="off" />
    <span id="count"></span>
  </div>
  <div id="type-filter"></div>
  <div id="loading">Loading Pokédex…</div>
  <div id="empty">No Pokémon match your search.</div>
  <div id="grid"></div>
</main>

<!-- ── Detail modal ─────────────────────────────────────── -->
<div id="detail-backdrop">
  <div id="detail-panel">
    <button id="detail-close" aria-label="Close">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="1" y1="1" x2="13" y2="13"/><line x1="13" y1="1" x2="1" y2="13"/>
      </svg>
    </button>
    <div id="detail-name" class="detail-name"></div>
    <div class="detail-body">
      <div class="detail-left">
        <div class="detail-top-row">
          <div id="detail-sprite" class="detail-sprite-wrap"></div>
          <div id="detail-stats"  class="detail-info"></div>
        </div>
        <div id="detail-types"></div>
        <div id="detail-evo"></div>
        <div id="detail-misc"></div>
      </div>
      <div class="detail-right" id="detail-right"></div>
    </div>
  </div>
</div>

<!-- ── Move detail modal ────────────────────────────────── -->
<div id="move-backdrop">
  <div id="move-panel">
    <button id="move-close" aria-label="Close">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="1" y1="1" x2="13" y2="13"/><line x1="13" y1="1" x2="1" y2="13"/>
      </svg>
    </button>
    <div id="move-content"></div>
  </div>
</div>

<script>
// ── sidebar ────────────────────────────────────────────────────────────────
const btn     = document.getElementById('logo-btn');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
const openSidebar  = () => { sidebar.classList.add('open');    overlay.classList.add('visible'); };
const closeSidebar = () => { sidebar.classList.remove('open'); overlay.classList.remove('visible'); };
btn.addEventListener('click', () => sidebar.classList.contains('open') ? closeSidebar() : openSidebar());
overlay.addEventListener('click', closeSidebar);

// ── detail modal ──────────────────────────────────────────────────────────
const backdrop    = document.getElementById('detail-backdrop');
const detailName  = document.getElementById('detail-name');
const detailSpr   = document.getElementById('detail-sprite');
const detailStats = document.getElementById('detail-stats');
const detailTypes = document.getElementById('detail-types');
const detailEvo   = document.getElementById('detail-evo');
const detailMisc  = document.getElementById('detail-misc');
const detailRight = document.getElementById('detail-right');

document.getElementById('detail-close').addEventListener('click', closeDetail);
backdrop.addEventListener('click', e => { if (e.target === backdrop) closeDetail(); });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (backdrop.classList.contains('open')) closeDetail();
    else closeSidebar();
  }
});

function openDetail(name) { backdrop.classList.add('open'); loadDetail(name); }
function closeDetail()    { backdrop.classList.remove('open'); }

// ── move detail modal ─────────────────────────────────────────────────────
const moveBackdrop = document.getElementById('move-backdrop');
const moveContent  = document.getElementById('move-content');
document.getElementById('move-close').addEventListener('click', closeMoveDetail);
moveBackdrop.addEventListener('click', e => { if (e.target === moveBackdrop) closeMoveDetail(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && moveBackdrop.classList.contains('open')) closeMoveDetail();
});

function openMoveDetail(slug) { moveBackdrop.classList.add('open'); loadMoveDetail(slug); }
function closeMoveDetail()    { moveBackdrop.classList.remove('open'); }

async function loadMoveDetail(slug) {
  moveContent.innerHTML = '<p style="color:var(--text-muted);padding:20px 0">Loading…</p>';
  let d;
  try {
    d = await fetch(`/api/moves/${slug}`).then(r => r.json());
  } catch {
    moveContent.innerHTML = '<p style="color:var(--text-muted)">Error loading data.</p>';
    return;
  }

  const desc = (d.description || []).join('').replace(/\n/g, ' ').trim();
  const priorityStr = d.priority > 0 ? `+${d.priority}` : `${d.priority ?? 0}`;
  const effectVal = d.effect
    ? fmtConst(d.effect.type) + (d.effect.chance ? ` (${d.effect.chance}%)` : '')
    : '';
  const contestVal = d.contest ? fmtConst(d.contest.type) : '';
  const flags = (d.flags || []).map(f =>
    `<span class="flag-badge">${fmtConst(f)}</span>`
  ).join('');

  moveContent.innerHTML = `
    <div class="move-detail-name">${d.name || slug}</div>
    ${desc ? `<div class="move-detail-desc">${desc}</div>` : ''}
    <div class="move-detail-badges">
      <div class="col"><div class="section-title">Type</div>${d.type ? `<span class="type-badge ${typeClass(d.type)}">${typeLabel(d.type)}</span>` : '—'}</div>
      <div class="col"><div class="section-title">Class</div>${d.class ? classBadge(d.class) : '—'}</div>
    </div>
    <div class="section-title">Stats</div>
    <div class="move-detail-meta">
      <div class="meta-item"><span class="mk">Power</span>   <span class="mv">${d.power || '—'}</span></div>
      <div class="meta-item"><span class="mk">Accuracy</span><span class="mv">${d.accuracy ? d.accuracy + '%' : '—'}</span></div>
      <div class="meta-item"><span class="mk">PP</span>      <span class="mv">${d.pp ?? '—'}</span></div>
      <div class="meta-item"><span class="mk">Priority</span><span class="mv">${priorityStr}</span></div>
      <div class="meta-item"><span class="mk">Range</span>   <span class="mv">${fmtConst(d.range) || '—'}</span></div>
      ${effectVal  ? `<div class="meta-item"><span class="mk">Effect</span>  <span class="mv">${effectVal}</span></div>` : ''}
      ${contestVal ? `<div class="meta-item"><span class="mk">Contest</span><span class="mv">${contestVal}</span></div>` : ''}
    </div>
    ${flags ? `<div class="section-title" style="margin-bottom:8px">Flags</div><div class="flags-list">${flags}</div>` : ''}
  `;
}
const LEARNSET_TABS = [
  { key: 'by_level',  label: 'By Level' },
  { key: 'by_tm',     label: 'TM / HM'  },
  { key: 'by_tutor',  label: 'Tutor'    },
  { key: 'egg_moves', label: 'Egg'      },
];

function classBadge(cls) {
  const map = { CLASS_PHYSICAL: 'physical', CLASS_SPECIAL: 'special', CLASS_STATUS: 'status' };
  const k = map[cls] || 'status';
  const label = k.charAt(0).toUpperCase() + k.slice(1);
  return `<span class="move-class move-class-${k}">${label}</span>`;
}

function buildLearnsetPanel(learnset) {
  const wrap = document.createElement('div');

  const title = document.createElement('div');
  title.className = 'section-title';
  title.textContent = 'Learnset';
  wrap.appendChild(title);

  // tabs
  const tabBar = document.createElement('div');
  tabBar.className = 'learnset-tabs';

  const tableWrap = document.createElement('div');

  let activeKey = null;

  function showTab(key) {
    activeKey = key;
    tabBar.querySelectorAll('.ls-tab').forEach(b =>
      b.classList.toggle('active', b.dataset.key === key)
    );
    tableWrap.innerHTML = '';

    const moves = learnset[key] || [];
    if (!moves.length) {
      tableWrap.innerHTML = '<p style="color:var(--text-muted);font-size:0.8rem;padding:8px 0">None</p>';
      return;
    }

    const table = document.createElement('table');
    table.className = 'move-table';

    // header
    const thead = document.createElement('thead');
    let thHTML = '';
    if (key === 'by_level') thHTML += '<th class="col-lv">Lv</th>';
    if (key === 'by_tm')    thHTML += '<th class="col-tm">TM</th>';
    thHTML += '<th class="col-name">Move</th><th>Type</th><th>Cat</th><th class="col-pow">Pow</th><th class="col-acc">Acc</th>';
    thead.innerHTML = `<tr>${thHTML}</tr>`;
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    moves.forEach(m => {
      const tr = document.createElement('tr');
      let html = '';
      if (key === 'by_level') html += `<td class="col-lv">${m.level}</td>`;
      if (key === 'by_tm')    html += `<td class="col-tm">${m.tm}</td>`;
      html += `<td class="col-name">${m.name ?? '—'}</td>`;
      html += `<td>${m.type ? `<span class="type-badge ${typeClass(m.type)}">${typeLabel(m.type)}</span>` : '—'}</td>`;
      html += `<td>${m.class ? classBadge(m.class) : '—'}</td>`;
      html += `<td class="col-pow">${m.power || '—'}</td>`;
      html += `<td class="col-acc">${m.accuracy || '—'}</td>`;
      tr.innerHTML = html;
      if (m.slug) tr.addEventListener('click', () => openMoveDetail(m.slug));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    tableWrap.appendChild(table);
  }

  LEARNSET_TABS.forEach(({ key, label }) => {
    const btn = document.createElement('button');
    btn.className = 'ls-tab';
    btn.dataset.key = key;
    btn.textContent = label;
    const count = (learnset[key] || []).length;
    if (!count) btn.disabled = true;
    btn.addEventListener('click', () => showTab(key));
    tabBar.appendChild(btn);
  });

  wrap.appendChild(tabBar);
  wrap.appendChild(tableWrap);

  // auto-select first non-empty tab
  const first = LEARNSET_TABS.find(({ key }) => (learnset[key] || []).length > 0);
  if (first) showTab(first.key);

  return wrap;
}

// ── type helpers ──────────────────────────────────────────────────────────
const TYPE_RE = /^TYPE_(.+)$/;
function typeKey(raw)   { const m = raw.match(TYPE_RE); return m ? m[1].toLowerCase() : 'unknown'; }
function typeLabel(raw) { const k = typeKey(raw); return k.charAt(0).toUpperCase() + k.slice(1); }
function typeClass(raw) { return 'type-' + typeKey(raw); }

function typeBadge(raw) {
  const el = document.createElement('span');
  el.className = 'type-badge ' + typeClass(raw);
  el.textContent = typeLabel(raw);
  return el;
}

// Draw left half of double-wide sprite onto a canvas at given pixel scale
function makeSpriteCanvas(url, scale = 1) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const halfW = Math.floor(img.naturalWidth / 2);
      const c = document.createElement('canvas');
      c.width  = halfW;
      c.height = img.naturalHeight;
      c.getContext('2d').drawImage(img, 0, 0);
      c.style.width  = (halfW              * scale) + 'px';
      c.style.height = (img.naturalHeight  * scale) + 'px';
      resolve(c);
    };
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

// ── type filter ───────────────────────────────────────────────────────────
const ALL_TYPES = [
  'normal','fire','water','electric','grass','ice',
  'fighting','poison','ground','flying','psychic','bug',
  'rock','ghost','dragon','dark','steel',
];
let activeType = null;

const filterRow = document.getElementById('type-filter');
ALL_TYPES.forEach(t => {
  const b = document.createElement('button');
  b.className = `tf-btn type-${t}`;
  b.textContent = t.charAt(0).toUpperCase() + t.slice(1);
  b.dataset.type = t;
  b.addEventListener('click', () => {
    activeType = activeType === t ? null : t;
    filterRow.querySelectorAll('.tf-btn').forEach(x =>
      x.classList.toggle('active', x.dataset.type === activeType)
    );
    applyFilters();
  });
  filterRow.appendChild(b);
});

// ── stat helpers ──────────────────────────────────────────────────────────
const STAT_LABELS = {
  hp:'HP', attack:'Atk', defense:'Def',
  special_attack:'SpA', special_defense:'SpD', speed:'Spe',
};
const STAT_MAX = 255;
function statBarCls(v) { return v >= 130 ? 'hi vhi' : v >= 90 ? 'hi' : ''; }

function buildStatsBlock(stats) {
  const wrap = document.createElement('div');

  const title = document.createElement('div');
  title.className = 'section-title';
  title.textContent = 'Base Stats';
  wrap.appendChild(title);

  const table = document.createElement('table');
  table.className = 'stats-table';
  let total = 0;
  for (const [key, label] of Object.entries(STAT_LABELS)) {
    const v = stats[key] ?? 0;
    total += v;
    const pct = Math.round((v / STAT_MAX) * 100);
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="sn">${label}</td><td class="sv">${v}</td>
      <td><div class="stat-bar-wrap"><div class="stat-bar ${statBarCls(v)}" style="width:${pct}%"></div></div></td>`;
    table.appendChild(tr);
  }
  wrap.appendChild(table);

  const tot = document.createElement('div');
  tot.className = 'stats-total';
  tot.innerHTML = `<span class="lbl">Total</span><span class="val">${total}</span>`;
  wrap.appendChild(tot);

  return wrap;
}

// Strip constant prefix and prettify: "ABILITY_MAGNET_PULL" → "Magnet Pull"
function fmtConst(s) {
  return (s || '').replace(/^[A-Z]+?_/, '').replace(/_/g, ' ')
    .toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}

function fmtEvoMethod(method, value) {
  const item    = () => fmtConst(String(value));
  const move    = () => fmtConst(String(value));
  const species = () => fmtConst(String(value));
  switch (method) {
    case 'EVO_LEVEL':                   return `Lv. ${value}`;
    case 'EVO_LEVEL_MALE':              return `Lv. ${value} (Male)`;
    case 'EVO_LEVEL_FEMALE':            return `Lv. ${value} (Female)`;
    case 'EVO_LEVEL_DAY':               return `Lv. ${value} (Day)`;
    case 'EVO_LEVEL_NIGHT':             return `Lv. ${value} (Night)`;
    case 'EVO_LEVEL_NINJASK':           return `Lv. ${value}`;
    case 'EVO_LEVEL_SHEDINJA':          return 'Empty Slot & Extra Ball';
    case 'EVO_LEVEL_HAPPINESS':         return 'Happiness';
    case 'EVO_LEVEL_HAPPINESS_DAY':     return 'Happiness (Day)';
    case 'EVO_LEVEL_HAPPINESS_NIGHT':   return 'Happiness (Night)';
    case 'EVO_LEVEL_BEAUTY':            return `Beauty ${value}`;
    case 'EVO_LEVEL_ATK_GT_DEF':        return `Lv. ${value} (Atk > Def)`;
    case 'EVO_LEVEL_ATK_EQ_DEF':        return `Lv. ${value} (Atk = Def)`;
    case 'EVO_LEVEL_ATK_LT_DEF':        return `Lv. ${value} (Atk < Def)`;
    case 'EVO_LEVEL_PID_LOW':           return `Lv. ${value} (PID Low)`;
    case 'EVO_LEVEL_PID_HIGH':          return `Lv. ${value} (PID High)`;
    case 'EVO_LEVEL_WITH_HELD_ITEM':    return `Lv. up w/ ${item()}`;
    case 'EVO_LEVEL_WITH_HELD_ITEM_DAY' : return `Lv. up w/ ${item()} (Day)`;
    case 'EVO_LEVEL_WITH_HELD_ITEM_NIGHT' : return `Lv. up w/ ${item()} (Night)`;
    case 'EVO_LEVEL_KNOW_MOVE':         return `Lv. up knowing ${move()}`;
    case 'EVO_LEVEL_SPECIES_IN_PARTY':  return `Lv. up w/ ${species()} in party`;
    case 'EVO_LEVEL_MAGNETIC_FIELD':    return 'Lv. up (Magnetic Field)';
    case 'EVO_LEVEL_MOSS_ROCK':         return 'Lv. up (Moss Rock)';
    case 'EVO_LEVEL_ICE_ROCK':          return 'Lv. up (Ice Rock)';
    case 'EVO_USE_ITEM':                return `Use ${item()}`;
    case 'EVO_USE_ITEM_MALE':           return `Use ${item()} (Male)`;
    case 'EVO_USE_ITEM_FEMALE':         return `Use ${item()} (Female)`;
    case 'EVO_TRADE':                   return 'Trade';
    case 'EVO_TRADE_WITH_HELD_ITEM':    return `Trade w/ ${item()}`;
    default:                            return fmtConst(method) + (value ? ` ${value}` : '');
  }
}

// ── card builder ──────────────────────────────────────────────────────────
function buildCard(pk) {
  const card = document.createElement('div');
  card.className = 'pk-card';
  card.addEventListener('click', () => openDetail(pk.name));

  // single sprite — male preferred
  const col = document.createElement('div');
  col.className = 'sprite-col';
  card.appendChild(col);

  makeSpriteCanvas(`/sprites/${pk.name}/male`, 2).then(c => {
    if (c) { col.appendChild(c); return; }
    // fall back to female if no male sprite
    return makeSpriteCanvas(`/sprites/${pk.name}/female`, 2).then(cf => {
      if (cf) col.appendChild(cf);
    });
  });

  const nameEl = document.createElement('div');
  nameEl.className = 'pk-name';
  nameEl.textContent = pk.name.replace(/-/g, ' ');
  card.appendChild(nameEl);

  const types = [...new Set(pk.types)];
  const typesEl = document.createElement('div');
  typesEl.className = 'types';
  types.forEach(t => typesEl.appendChild(typeBadge(t)));
  card.appendChild(typesEl);

  return card;
}

// ── detail loader ─────────────────────────────────────────────────────────
async function loadDetail(name) {
  detailName.textContent = '…';
  detailSpr.innerHTML   = '';
  detailStats.innerHTML = '';
  detailTypes.innerHTML = '';
  detailEvo.innerHTML   = '';
  detailMisc.innerHTML  = '';
  detailRight.innerHTML = '';

  let d;
  try {
    d = await fetch(`/api/pokemon/${name}`).then(r => r.json());
  } catch {
    detailName.textContent = 'Error loading data';
    return;
  }

  detailName.textContent = name.replace(/-/g, ' ');

  // single sprite — male preferred, fall back to female
  const sprCanvas = await makeSpriteCanvas(`/sprites/${name}/male`, 2.8)
    ?? await makeSpriteCanvas(`/sprites/${name}/female`, 2.8);
  if (sprCanvas) {
    detailSpr.appendChild(sprCanvas);
    // stats column height matches sprite height
    detailStats.style.height = sprCanvas.style.height;
  }

  // base stats (right of sprite)
  if (d.base_stats) detailStats.appendChild(buildStatsBlock(d.base_stats));

  // pokédex entry text below stats
  const entryLines = d.pokedex_data?.en?.entry_text;
  if (entryLines) {
    const entryEl = document.createElement('p');
    entryEl.style.cssText = 'font-size:0.8rem; color:var(--text-muted); line-height:1.5; margin-top:8px;';
    entryEl.textContent = entryLines.join('').replace(/\n/g, ' ').trim();
    detailStats.appendChild(entryEl);
  }

  // types
  const types = [...new Set(d.types || [])];
  const typesTitle = document.createElement('div');
  typesTitle.className = 'section-title';
  typesTitle.textContent = 'Type';
  detailTypes.appendChild(typesTitle);
  const typesBadges = document.createElement('div');
  typesBadges.className = 'types';
  typesBadges.style.justifyContent = 'flex-start';
  types.forEach(t => typesBadges.appendChild(typeBadge(t)));
  detailTypes.appendChild(typesBadges);

  // evolutions left column, offspring right column
  const evoRow = document.createElement('div');
  evoRow.style.cssText = 'display:grid; grid-template-columns:1fr 1fr; gap:28px; align-items:flex-start;';

  const evos = d.evolutions || [];
  if (evos.length) {
    const evoWrap = document.createElement('div');
    const evoTitle = document.createElement('div');
    evoTitle.className = 'section-title';
    evoTitle.textContent = 'Evolution';
    evoWrap.appendChild(evoTitle);

    const chain = document.createElement('div');
    chain.className = 'evo-chain';
    evos.forEach(evo => {
      // evo is [method, target] or [method, value, target]
      const method = evo[0];
      const target = evo[evo.length - 1];
      const value  = evo.length === 3 ? evo[1] : null;

      const targetFolder = target.replace(/^SPECIES_/, '').toLowerCase();
      const targetStr    = targetFolder.replace(/_/g, ' ')
        .replace(/\b\w/g, c => c.toUpperCase());
      const methodStr = fmtEvoMethod(method, value);

      const entry = document.createElement('div');
      entry.className = 'evo-entry';
      entry.innerHTML = `
        <span class="evo-arrow">→</span>
        <span class="evo-target">${targetStr}</span>
        <span class="evo-method">(${methodStr})</span>`;
      entry.addEventListener('click', () => openDetail(targetFolder));
      chain.appendChild(entry);
    });
    evoWrap.appendChild(chain);
    evoRow.appendChild(evoWrap);
  } else {
    evoRow.appendChild(document.createElement('div')); // placeholder for right-column alignment
  }

  const offspring = d.offspring || '';
  const offSelf = offspring.replace(/^SPECIES_/, '').toLowerCase() === name;
  if (offspring && offspring !== 'SPECIES_NONE' && !offSelf) {
    const offFolder = offspring.replace(/^SPECIES_/, '').toLowerCase();
    const offStr    = offFolder.replace(/_/g, ' ')
      .replace(/\b\w/g, c => c.toUpperCase());

    const offWrap = document.createElement('div');
    const offTitle = document.createElement('div');
    offTitle.className = 'section-title';
    offTitle.textContent = 'Offspring';
    offWrap.appendChild(offTitle);

    const offEntry = document.createElement('div');
    offEntry.className = 'evo-entry';
    offEntry.innerHTML = `<span class="evo-target">${offStr}</span>`;
    offEntry.addEventListener('click', () => openDetail(offFolder));
    offWrap.appendChild(offEntry);
    evoRow.appendChild(offWrap);
  }

  if (evoRow.children.length) detailEvo.appendChild(evoRow);

  // general info
  const miscTitle = document.createElement('div');
  miscTitle.className = 'section-title';
  miscTitle.textContent = 'Info';
  detailMisc.appendChild(miscTitle);

  const abilities  = (d.abilities  || []).filter(a => a !== 'ABILITY_NONE').map(fmtConst);
  const eggGroups  = [...new Set((d.egg_groups || []).filter(g => g !== 'EGG_GROUP_NONE').map(fmtConst))];

  const rows = [
    ['Abilities',    abilities.join(', ')          || '—'],
    ['Egg Groups',   eggGroups.join(', ')           || '—'],
    ['Catch Rate',   d.catch_rate                  ?? '—'],
    ['Base Exp',     d.base_exp_reward             ?? '—'],
    ['Hatch Cycles', d.hatch_cycles                ?? '—'],
    ['Friendship',   d.base_friendship             ?? '—'],
    ['Exp Rate',     fmtConst(d.exp_rate    || '') || '—'],
    ['Gender',       fmtConst(d.gender_ratio|| '') || '—'],
  ];

  const meta = document.createElement('div');
  meta.className = 'detail-meta';
  rows.forEach(([k, v]) => {
    const item = document.createElement('div');
    item.className = 'meta-item';
    item.innerHTML = `<span class="mk">${k}</span><span class="mv">${v}</span>`;
    meta.appendChild(item);
  });
  detailMisc.appendChild(meta);

  // learnset (right column)
  if (d.learnset_resolved) {
    detailRight.appendChild(buildLearnsetPanel(d.learnset_resolved));
  }
}

// ── filter + render ───────────────────────────────────────────────────────
let allPokemon = [];
const grid    = document.getElementById('grid');
const loading = document.getElementById('loading');
const empty   = document.getElementById('empty');
const countEl = document.getElementById('count');
const search  = document.getElementById('search');

function applyFilters() {
  const q = search.value.trim().toLowerCase();
  let list = allPokemon;
  if (q)          list = list.filter(p => p.name.includes(q));
  if (activeType) list = list.filter(p => p.types.some(t => typeKey(t) === activeType));
  render(list);
}

function render(list) {
  grid.innerHTML = '';
  empty.style.display = list.length === 0 ? 'block' : 'none';
  countEl.textContent  = `${list.length} Pokémon`;
  list.forEach(pk => grid.appendChild(buildCard(pk)));
}

fetch('/api/pokemon')
  .then(r => r.json())
  .then(data => {
    allPokemon = data;
    loading.style.display = 'none';
    render(allPokemon);
  })
  .catch(() => { loading.textContent = 'Failed to load data. Is the server running?'; });

search.addEventListener('input', applyFilters);
</script>
</body>
</html>
