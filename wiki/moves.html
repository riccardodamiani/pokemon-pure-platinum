<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moves — Pure Platinum Wiki</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0f1117;
      --surface:    #1a1d27;
      --surface2:   #22263a;
      --accent:     #e63946;
      --accent2:    #457b9d;
      --text:       #e8eaf0;
      --text-muted: #7a7f99;
      --sidebar-w:  260px;
      --header-h:   64px;
      --radius:     10px;
      --tr:         0.3s cubic-bezier(0.4,0,0.2,1);
    }

    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; overflow-x: hidden;
    }

    /* ── SIDEBAR OVERLAY ─────────────────────────── */
    #overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      opacity: 0; pointer-events: none;
      transition: opacity var(--tr); z-index: 90;
    }
    #overlay.visible { opacity: 1; pointer-events: all; }

    /* ── SIDEBAR ─────────────────────────────────── */
    #sidebar {
      position: fixed; top: 0; left: 0;
      width: var(--sidebar-w); height: 100vh;
      background: var(--surface);
      border-right: 1px solid rgba(255,255,255,0.06);
      transform: translateX(calc(-1 * var(--sidebar-w)));
      transition: transform var(--tr);
      z-index: 100; display: flex; flex-direction: column;
      padding-top: var(--header-h);
    }
    #sidebar.open { transform: translateX(0); }
    .sidebar-header {
      padding: 24px 24px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .sidebar-title {
      font-size: 0.75rem; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-muted);
    }
    .sidebar-nav { padding: 12px 0; flex: 1; }
    .nav-item {
      display: flex; align-items: center; gap: 14px;
      padding: 13px 24px; color: var(--text-muted); cursor: pointer;
      border-left: 3px solid transparent;
      transition: color .2s, background .2s, border-color .2s;
      font-size: 0.95rem; font-weight: 500;
      text-decoration: none; user-select: none;
    }
    .nav-item:hover, .nav-item.active {
      background: var(--surface2); color: var(--text);
      border-left-color: var(--accent);
    }
    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.7; }
    .nav-item:hover svg, .nav-item.active svg { opacity: 1; }

    /* ── HEADER ──────────────────────────────────── */
    #header {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--header-h); background: var(--surface);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex; align-items: center;
      padding: 0 24px; z-index: 80; gap: 16px;
    }
    #logo-btn {
      background: none; border: none; cursor: pointer;
      padding: 6px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s, transform .2s; flex-shrink: 0;
    }
    #logo-btn:hover { background: rgba(255,255,255,.07); transform: rotate(15deg); }
    #logo-btn:active { transform: rotate(15deg) scale(.92); }
    .pball-top    { fill: #e63946; }
    .pball-bot    { fill: #d0d4e8; }
    .pball-band   { fill: #111318; }
    .pball-center { fill: #111318; stroke: #d0d4e8; stroke-width: 2.5; }
    .pball-dot    { fill: #d0d4e8; }
    #site-name {
      font-size: 1.05rem; font-weight: 700;
      letter-spacing: .04em; color: var(--text);
      text-decoration: none; user-select: none;
    }
    #site-name span { color: var(--accent); }

    /* ── MAIN ────────────────────────────────────── */
    #main {
      padding-top: calc(var(--header-h) + 28px);
      padding-bottom: 48px; max-width: 1400px;
      margin: 0 auto; padding-left: 24px; padding-right: 24px;
    }

    /* ── TOOLBAR ─────────────────────────────────── */
    .toolbar {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 16px; flex-wrap: wrap;
    }
    .toolbar h1 {
      font-size: 1.4rem; font-weight: 800;
      letter-spacing: -.01em; flex: 1;
    }
    .toolbar h1 span { color: var(--accent); }
    #search {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; color: var(--text);
      font-size: 0.9rem; padding: 8px 14px;
      outline: none; width: 220px;
      transition: border-color .2s;
    }
    #search:focus { border-color: var(--accent); }
    #search::placeholder { color: var(--text-muted); }
    #count { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; }

    /* ── TYPE FILTER ─────────────────────────────── */
    #type-filter {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-bottom: 16px;
    }
    .tf-btn {
      font-size: 0.7rem; font-weight: 700;
      letter-spacing: .07em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 5px;
      border: 2px solid transparent;
      cursor: pointer; color: #fff;
      opacity: 0.5; transition: opacity .15s, border-color .15s;
      user-select: none;
    }
    .tf-btn:hover  { opacity: 0.8; }
    .tf-btn.active { opacity: 1; border-color: rgba(255,255,255,0.7); }

    /* ── CLASS FILTER ────────────────────────────── */
    #class-filter {
      display: flex; gap: 6px;
      margin-bottom: 24px;
    }
    .cf-btn {
      font-size: 0.7rem; font-weight: 700;
      letter-spacing: .07em; text-transform: uppercase;
      padding: 4px 12px; border-radius: 5px;
      border: 2px solid transparent;
      cursor: pointer; color: #fff;
      opacity: 0.5; transition: opacity .15s, border-color .15s;
      user-select: none;
    }
    .cf-btn:hover  { opacity: 0.8; }
    .cf-btn.active { opacity: 1; border-color: rgba(255,255,255,0.7); }
    .cf-btn-physical { background: #c03028; }
    .cf-btn-special  { background: #6890f0; }
    .cf-btn-status   { background: #555;    }

    /* ── GRID ────────────────────────────────────── */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }
    .mv-card {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex; flex-direction: column; gap: 8px;
      cursor: pointer;
      transition: border-color .2s, transform .2s, background .2s;
    }
    .mv-card:hover {
      border-color: rgba(255,255,255,0.2);
      transform: translateY(-3px);
      background: var(--surface2);
    }
    .mv-name {
      font-size: 0.9rem; font-weight: 700;
      letter-spacing: .02em; color: var(--text);
      margin-bottom: 2px;
    }
    .mv-desc {
      font-size: 0.72rem; color: var(--text-muted);
      line-height: 1.45; flex: 1;
    }
    .mv-card-info {
      display: flex; flex-direction: column; gap: 6px;
    }
    .mv-card-info .row { display: flex; gap: 14px; align-items: center; }
    .mv-card-info .row-spread { display: flex; justify-content: space-between; align-items: center; }
    .mv-card-info .col { display: flex; flex-direction: column; gap: 3px; }
    .mv-card-info .col-right { display: flex; flex-direction: column; gap: 3px; align-items: flex-end; }
    .mv-card-info .mk {
      color: var(--text-muted); font-size: 0.68rem; font-weight: 600;
      letter-spacing: .07em; text-transform: uppercase;
      display: block; margin-bottom: 2px;
    }
    .mv-card-info .mv { font-weight: 600; color: var(--text); white-space: nowrap; }

    /* ── TYPE COLORS ─────────────────────────────── */
    .type-normal   { background: #9a9a7a; }
    .type-fire     { background: #f08030; }
    .type-water    { background: #6890f0; }
    .type-electric { background: #f8d030; color: #333; }
    .type-grass    { background: #78c850; }
    .type-ice      { background: #98d8d8; color: #333; }
    .type-fighting { background: #c03028; }
    .type-poison   { background: #a040a0; }
    .type-ground   { background: #e0c068; color: #333; }
    .type-flying   { background: #a890f0; }
    .type-psychic  { background: #f85888; }
    .type-bug      { background: #a8b820; }
    .type-rock     { background: #b8a038; }
    .type-ghost    { background: #705898; }
    .type-dragon   { background: #7038f8; }
    .type-dark     { background: #705848; }
    .type-steel    { background: #b8b8d0; color: #333; }
    .type-unknown  { background: #68a090; }
    .type-badge {
      font-size: 0.63rem; font-weight: 700;
      letter-spacing: .07em; text-transform: uppercase;
      padding: 2px 7px; border-radius: 4px; color: #fff;
    }

    .move-class {
      font-size: 0.62rem; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; padding: 2px 6px; border-radius: 3px;
    }
    .move-class-physical { background: #c03028; color: #fff; }
    .move-class-special  { background: #6890f0; color: #fff; }
    .move-class-status   { background: #555; color: #ccc; }

    /* ── DETAIL MODAL ────────────────────────────── */
    #detail-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.72);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; opacity: 0; pointer-events: none;
      transition: opacity var(--tr);
    }
    #detail-backdrop.open { opacity: 1; pointer-events: all; }
    #detail-panel {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      width: min(680px, calc(100vw - 32px));
      max-height: calc(100vh - 48px);
      overflow-y: auto;
      padding: 28px;
      position: relative;
      transform: translateY(20px);
      transition: transform var(--tr);
    }
    #detail-backdrop.open #detail-panel { transform: translateY(0); }

    #detail-close {
      position: absolute; top: 16px; right: 16px;
      background: rgba(255,255,255,0.06);
      border: none; border-radius: 50%;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-muted);
      transition: background .2s, color .2s;
    }
    #detail-close:hover { background: rgba(255,255,255,0.12); color: var(--text); }

    .detail-move-name {
      font-size: 1.6rem; font-weight: 800;
      margin-bottom: 20px; padding-right: 40px;
    }
    .detail-badges {
      display: grid; grid-template-columns: 1fr 1fr;
      margin-bottom: 20px;
    }
    .detail-badges .col { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }

    .section-title {
      font-size: 0.7rem; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 6px;
    }

    .detail-meta {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px 16px; margin-bottom: 20px;
    }
    .meta-item { font-size: 0.8rem; }
    .meta-item .mk {
      color: var(--text-muted); font-size: 0.68rem; font-weight: 600;
      letter-spacing: .07em; text-transform: uppercase;
      display: block; margin-bottom: 2px;
    }
    .meta-item .mv { font-weight: 600; }

    .detail-desc {
      font-size: 0.8rem; color: var(--text-muted);
      line-height: 1.5; margin-bottom: 20px;
    }

    .flags-list {
      display: flex; flex-wrap: wrap; gap: 5px;
    }
    .flag-badge {
      font-size: 0.66rem; font-weight: 600;
      padding: 2px 8px; border-radius: 4px;
      background: var(--surface2); color: #c8ccd8;
      letter-spacing: .04em;
    }

    #loading { text-align: center; padding: 80px 0; color: var(--text-muted); }
    #empty   { display: none; text-align: center; padding: 80px 0; color: var(--text-muted); }
  </style>
</head>
<body>

<div id="overlay"></div>

<!-- ── Sidebar ──────────────────────────────────────────── -->
<nav id="sidebar">
  <div class="sidebar-header"><span class="sidebar-title">Navigation</span></div>
  <div class="sidebar-nav">
    <a class="nav-item" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>

    </a>
    <a class="nav-item" href="/changes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>Changes
    </a>
    <a class="nav-item" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        <line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/>
      </svg>Map
    </a>
    <a class="nav-item" href="/trainers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>Trainers
    </a>
    <a class="nav-item" href="/pokemon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="2" y1="12" x2="22" y2="12"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>Pokémon
    </a>
    <a class="nav-item" href="/items">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
        <path d="M16 7V5a2 2 0 0 0-4 0v2"/>
        <line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/>
      </svg>Items
    </a>
    <a class="nav-item active" href="/moves">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>Moves
    </a>
  </div>
</nav>

<!-- ── Header ───────────────────────────────────────────── -->
<header id="header">
  <button id="logo-btn" aria-label="Toggle menu">
    <svg width="36" height="36" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
      <clipPath id="clip-circle"><circle cx="18" cy="18" r="16"/></clipPath>
      <circle cx="18" cy="18" r="16" class="pball-bot"/>
      <rect x="2" y="2" width="32" height="16" class="pball-top" clip-path="url(#clip-circle)"/>
      <rect x="2" y="16" width="32" height="4" class="pball-band"/>
      <circle cx="18" cy="18" r="5" class="pball-center"/>
      <circle cx="18" cy="18" r="2.5" class="pball-dot"/>
    </svg>
  </button>
  <a id="site-name" href="/">Pure <span>Platinum</span> Wiki</a>
</header>

<!-- ── Main ─────────────────────────────────────────────── -->
<main id="main">
  <div class="toolbar">
    <h1>Move <span>Dex</span></h1>
    <input id="search" type="text" placeholder="Search…" autocomplete="off" />
    <span id="count"></span>
  </div>
  <div id="type-filter"></div>
  <div id="class-filter">
    <button class="cf-btn cf-btn-physical" data-class="CLASS_PHYSICAL">Physical</button>
    <button class="cf-btn cf-btn-special"  data-class="CLASS_SPECIAL">Special</button>
    <button class="cf-btn cf-btn-status"   data-class="CLASS_STATUS">Status</button>
  </div>
  <div id="loading">Loading moves…</div>
  <div id="empty">No moves match your search.</div>
  <div id="grid"></div>
</main>

<!-- ── Detail modal ─────────────────────────────────────── -->
<div id="detail-backdrop">
  <div id="detail-panel">
    <button id="detail-close" aria-label="Close">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="1" y1="1" x2="13" y2="13"/><line x1="13" y1="1" x2="1" y2="13"/>
      </svg>
    </button>
    <div id="detail-content"></div>
  </div>
</div>

<script>
// ── sidebar ────────────────────────────────────────────────────────────────
const btn     = document.getElementById('logo-btn');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
const openSidebar  = () => { sidebar.classList.add('open');    overlay.classList.add('visible'); };
const closeSidebar = () => { sidebar.classList.remove('open'); overlay.classList.remove('visible'); };
btn.addEventListener('click', () => sidebar.classList.contains('open') ? closeSidebar() : openSidebar());
overlay.addEventListener('click', closeSidebar);

// ── type helpers ──────────────────────────────────────────────────────────
const TYPE_RE = /^TYPE_(.+)$/;
function typeKey(raw)   { const m = (raw||'').match(TYPE_RE); return m ? m[1].toLowerCase() : 'unknown'; }
function typeLabel(raw) { const k = typeKey(raw); return k.charAt(0).toUpperCase() + k.slice(1); }
function typeClass(raw) { return 'type-' + typeKey(raw); }
function typeBadge(raw) {
  return `<span class="type-badge ${typeClass(raw)}">${typeLabel(raw)}</span>`;
}

// ── class helpers ─────────────────────────────────────────────────────────
const CLASS_MAP = {
  CLASS_PHYSICAL: 'physical',
  CLASS_SPECIAL:  'special',
  CLASS_STATUS:   'status',
};
function classBadge(cls) {
  const k = CLASS_MAP[cls] || 'status';
  return `<span class="move-class move-class-${k}">${k.charAt(0).toUpperCase()+k.slice(1)}</span>`;
}

// ── misc helpers ──────────────────────────────────────────────────────────
function fmtConst(s) {
  return (s || '').replace(/^[A-Z]+?_/, '').replace(/_/g, ' ')
    .toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}

// ── type filter ───────────────────────────────────────────────────────────
const ALL_TYPES = [
  'normal','fire','water','electric','grass','ice',
  'fighting','poison','ground','flying','psychic','bug',
  'rock','ghost','dragon','dark','steel',
];
let activeType  = null;
let activeClass = null;

const typeFilterRow = document.getElementById('type-filter');
ALL_TYPES.forEach(t => {
  const b = document.createElement('button');
  b.className = `tf-btn type-${t}`;
  b.textContent = t.charAt(0).toUpperCase() + t.slice(1);
  b.dataset.type = t;
  b.addEventListener('click', () => {
    activeType = activeType === t ? null : t;
    typeFilterRow.querySelectorAll('.tf-btn').forEach(x =>
      x.classList.toggle('active', x.dataset.type === activeType)
    );
    applyFilters();
  });
  typeFilterRow.appendChild(b);
});

document.getElementById('class-filter').addEventListener('click', e => {
  const btn = e.target.closest('.cf-btn');
  if (!btn) return;
  const cls = btn.dataset.class;
  activeClass = activeClass === cls ? null : cls;
  document.querySelectorAll('.cf-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.class === activeClass)
  );
  applyFilters();
});

// ── detail modal ──────────────────────────────────────────────────────────
const backdrop     = document.getElementById('detail-backdrop');
const detailContent= document.getElementById('detail-content');
document.getElementById('detail-close').addEventListener('click', closeDetail);
backdrop.addEventListener('click', e => { if (e.target === backdrop) closeDetail(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (backdrop.classList.contains('open')) closeDetail();
    else closeSidebar();
  }
});
function openDetail(slug) { backdrop.classList.add('open'); loadDetail(slug); }
function closeDetail()    { backdrop.classList.remove('open'); }

async function loadDetail(slug) {
  detailContent.innerHTML = '<p style="color:var(--text-muted);padding:20px 0">Loading…</p>';
  let d;
  try {
    d = await fetch(`/api/moves/${slug}`).then(r => r.json());
  } catch {
    detailContent.innerHTML = '<p style="color:var(--text-muted)">Error loading data.</p>';
    return;
  }

  const desc = (d.description || []).join('').replace(/\n/g,' ').trim();
  const flags = (d.flags || []).map(f =>
    `<span class="flag-badge">${fmtConst(f)}</span>`
  ).join('');

  const stat = (v) => v != null ? v : '—';
  const priorityStr = d.priority > 0 ? `+${d.priority}` : d.priority < 0 ? `${d.priority}` : '0';

  const contestVal = d.contest
    ? fmtConst(d.contest.type)
    : '';
  const effectVal = d.effect
    ? fmtConst(d.effect.type) + (d.effect.chance ? ` (${d.effect.chance}%)` : '')
    : '';

  detailContent.innerHTML = `
    <div class="detail-move-name">${d.name || slug}</div>
    ${desc ? `<div class="detail-desc">${desc}</div>` : ''}
    <div class="detail-badges">
      <div class="col"><div class="section-title">Type</div>${d.type ? typeBadge(d.type) : '—'}</div>
      <div class="col"><div class="section-title">Class</div>${d.class ? classBadge(d.class) : '—'}</div>
    </div>
    <div class="section-title">Stats</div>
    <div class="detail-meta">
      <div class="meta-item"><span class="mk">Power</span>   <span class="mv">${stat(d.power)}</span></div>
      <div class="meta-item"><span class="mk">Accuracy</span><span class="mv">${d.accuracy != null ? d.accuracy + '%' : '—'}</span></div>
      <div class="meta-item"><span class="mk">PP</span>      <span class="mv">${stat(d.pp)}</span></div>
      <div class="meta-item"><span class="mk">Priority</span><span class="mv">${priorityStr}</span></div>
      <div class="meta-item"><span class="mk">Range</span>   <span class="mv">${fmtConst(d.range) || '—'}</span></div>
      ${effectVal  ? `<div class="meta-item"><span class="mk">Effect</span>  <span class="mv">${effectVal}</span></div>`  : ''}
      ${contestVal ? `<div class="meta-item"><span class="mk">Contest</span> <span class="mv">${contestVal}</span></div>` : ''}
    </div>
    ${flags ? `<div class="section-title" style="margin-bottom:8px">Flags</div><div class="flags-list">${flags}</div>` : ''}
  `;
}

// ── card builder ──────────────────────────────────────────────────────────
function buildCard(mv) {
  const card = document.createElement('div');
  card.className = 'mv-card';
  card.addEventListener('click', () => openDetail(mv.name));

  const nameEl = document.createElement('div');
  nameEl.className = 'mv-name';
  nameEl.textContent = mv.display || mv.name;
  card.appendChild(nameEl);

  if (mv.description) {
    const descEl = document.createElement('div');
    descEl.className = 'mv-desc';
    descEl.textContent = mv.description;
    card.appendChild(descEl);
  }

  const clsKey = mv.class ? (CLASS_MAP[mv.class] || 'status') : null;
  const clsLabel = clsKey ? clsKey.charAt(0).toUpperCase() + clsKey.slice(1) : '—';

  const info = document.createElement('div');
  info.className = 'mv-card-info';
  info.innerHTML =
    `<div class="row-spread">
       <div class="col"><span class="mk">Type</span><span class="mv">${mv.type ? typeBadge(mv.type) : '—'}</span></div>
       <div class="col-right"><span class="mk">Class</span><span class="mv">${mv.class ? classBadge(mv.class) : '—'}</span></div>
     </div>` +
    `<div class="row">
       <div class="col"><span class="mk">Pow</span><span class="mv">${mv.power ?? '—'}</span></div>
       <div class="col"><span class="mk">Acc</span><span class="mv">${mv.accuracy != null ? mv.accuracy + '%' : '—'}</span></div>
       <div class="col"><span class="mk">PP</span><span class="mv">${mv.pp ?? '—'}</span></div>
     </div>`;
  card.appendChild(info);

  return card;
}

// ── filter + render ───────────────────────────────────────────────────────
let allMoves = [];
const grid    = document.getElementById('grid');
const loading = document.getElementById('loading');
const empty   = document.getElementById('empty');
const countEl = document.getElementById('count');
const search  = document.getElementById('search');

function applyFilters() {
  const q = search.value.trim().toLowerCase();
  let list = allMoves;
  if (q)           list = list.filter(m => (m.display || m.name).toLowerCase().includes(q));
  if (activeType)  list = list.filter(m => m.type && typeKey(m.type) === activeType);
  if (activeClass) list = list.filter(m => m.class === activeClass);
  render(list);
}

function render(list) {
  grid.innerHTML = '';
  empty.style.display = list.length === 0 ? 'block' : 'none';
  countEl.textContent = `${list.length} moves`;
  list.forEach(mv => grid.appendChild(buildCard(mv)));
}

fetch('/api/moves')
  .then(r => r.json())
  .then(data => {
    allMoves = data;
    loading.style.display = 'none';
    render(allMoves);
  })
  .catch(() => { loading.textContent = 'Failed to load data. Is the server running?'; });

search.addEventListener('input', applyFilters);
</script>
</body>
</html>
