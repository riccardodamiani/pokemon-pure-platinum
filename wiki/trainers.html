<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trainers — Pure Platinum Wiki</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0f1117;
      --surface:    #1a1d27;
      --surface2:   #22263a;
      --accent:     #e63946;
      --accent2:    #457b9d;
      --text:       #e8eaf0;
      --text-muted: #7a7f99;
      --sidebar-w:  260px;
      --header-h:   64px;
      --radius:     10px;
      --tr:         0.3s cubic-bezier(0.4,0,0.2,1);
    }

    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; overflow-x: hidden;
    }

    /* ── SIDEBAR OVERLAY ─────────────────────────── */
    #overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      opacity: 0; pointer-events: none;
      transition: opacity var(--tr); z-index: 90;
    }
    #overlay.visible { opacity: 1; pointer-events: all; }

    /* ── SIDEBAR ─────────────────────────────────── */
    #sidebar {
      position: fixed; top: 0; left: 0;
      width: var(--sidebar-w); height: 100vh;
      background: var(--surface);
      border-right: 1px solid rgba(255,255,255,0.06);
      transform: translateX(calc(-1 * var(--sidebar-w)));
      transition: transform var(--tr);
      z-index: 100; display: flex; flex-direction: column;
      padding-top: var(--header-h);
    }
    #sidebar.open { transform: translateX(0); }
    .sidebar-header {
      padding: 24px 24px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .sidebar-title {
      font-size: 0.75rem; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-muted);
    }
    .sidebar-nav { padding: 12px 0; flex: 1; }
    .nav-item {
      display: flex; align-items: center; gap: 14px;
      padding: 13px 24px; color: var(--text-muted); cursor: pointer;
      border-left: 3px solid transparent;
      transition: color .2s, background .2s, border-color .2s;
      font-size: 0.95rem; font-weight: 500;
      text-decoration: none; user-select: none;
    }
    .nav-item:hover, .nav-item.active {
      background: var(--surface2); color: var(--text);
      border-left-color: var(--accent);
    }
    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.7; }
    .nav-item:hover svg, .nav-item.active svg { opacity: 1; }

    /* ── HEADER ──────────────────────────────────── */
    #header {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--header-h); background: var(--surface);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex; align-items: center;
      padding: 0 24px; z-index: 80; gap: 16px;
    }
    #logo-btn {
      background: none; border: none; cursor: pointer;
      padding: 6px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s, transform .2s; flex-shrink: 0;
    }
    #logo-btn:hover { background: rgba(255,255,255,.07); transform: rotate(15deg); }
    #logo-btn:active { transform: rotate(15deg) scale(.92); }
    .pball-top    { fill: #e63946; }
    .pball-bot    { fill: #d0d4e8; }
    .pball-band   { fill: #111318; }
    .pball-center { fill: #111318; stroke: #d0d4e8; stroke-width: 2.5; }
    .pball-dot    { fill: #d0d4e8; }
    #site-name {
      font-size: 1.05rem; font-weight: 700;
      letter-spacing: .04em; color: var(--text);
      text-decoration: none; user-select: none;
    }
    #site-name span { color: var(--accent); }

    /* ── MAIN ────────────────────────────────────── */
    #main {
      padding-top: calc(var(--header-h) + 28px);
      padding-bottom: 48px; max-width: 1400px;
      margin: 0 auto; padding-left: 24px; padding-right: 24px;
    }

    /* ── TOOLBAR ─────────────────────────────────── */
    .toolbar {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 24px; flex-wrap: wrap;
    }
    .toolbar h1 {
      font-size: 1.4rem; font-weight: 800;
      letter-spacing: -.01em; flex: 1;
    }
    .toolbar h1 span { color: var(--accent); }
    #search {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; color: var(--text);
      font-size: 0.9rem; padding: 8px 14px;
      outline: none; width: 220px;
      transition: border-color .2s;
    }
    #search:focus { border-color: var(--accent); }
    #search::placeholder { color: var(--text-muted); }
    #count { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; }

    /* ── GRID ────────────────────────────────────── */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }
    .tr-card {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: var(--radius);
      padding: 14px 12px 12px;
      display: flex; flex-direction: column;
      align-items: center; gap: 8px;
      cursor: pointer;
      transition: border-color .2s, transform .2s, background .2s;
    }
    .tr-card:hover {
      border-color: rgba(255,255,255,0.2);
      transform: translateY(-3px);
      background: var(--surface2);
    }
    .tr-icon-canvas {
      image-rendering: pixelated; display: block;
      width: 80px; height: 80px;
    }
    .tr-icon-placeholder {
      width: 80px; height: 80px;
      background: var(--surface2); border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: 1.4rem;
    }
    .tr-name {
      font-size: 0.75rem; font-weight: 700;
      letter-spacing: .02em; text-transform: capitalize;
      color: var(--text); text-align: center; line-height: 1.3;
    }
    .tr-slug-label {
      font-size: 0.68rem; color: var(--text-muted);
      text-align: center; letter-spacing: .02em; font-style: italic;
    }
    .tr-class-label {
      font-size: 0.65rem; color: var(--text-muted);
      text-align: center; letter-spacing: .04em;
    }

    #loading { text-align: center; padding: 80px 0; color: var(--text-muted); }
    #empty   { display: none; text-align: center; padding: 80px 0; color: var(--text-muted); }

    /* ── DETAIL MODAL ────────────────────────────── */
    #detail-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.72);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; opacity: 0; pointer-events: none;
      transition: opacity var(--tr);
    }
    #detail-backdrop.open { opacity: 1; pointer-events: all; }

    #detail-panel {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      width: min(1100px, calc(100vw - 32px));
      max-height: calc(100vh - 48px);
      overflow-y: auto;
      padding: 28px;
      position: relative;
      transform: translateY(20px);
      transition: transform var(--tr);
    }
    #detail-backdrop.open #detail-panel { transform: translateY(0); }

    #detail-close {
      position: absolute; top: 16px; right: 16px;
      background: rgba(255,255,255,0.06);
      border: none; border-radius: 50%;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-muted);
      transition: background .2s, color .2s;
    }
    #detail-close:hover { background: rgba(255,255,255,0.12); color: var(--text); }

    .detail-name {
      font-size: 1.6rem; font-weight: 800;
      margin-bottom: 4px; padding-right: 40px;
    }
    .detail-slug {
      font-size: 1rem; font-weight: 400;
      color: var(--text-muted); margin-left: 10px; font-style: italic;
    }
    .detail-subtitle {
      font-size: 0.85rem; color: var(--text-muted);
      margin-bottom: 20px; font-weight: 500;
    }

    .detail-top-section {
      display: flex; gap: 24px; align-items: flex-start;
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .detail-info-col {
      display: flex; flex-direction: column; gap: 14px; flex: 1;
    }
    .detail-party-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .section-title {
      font-size: 0.7rem; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 8px;
    }

    /* trainer icon large */
    .trainer-icon-canvas {
      image-rendering: pixelated;
      display: block; width: 80px; height: 80px;
    }

    /* info grid */
    .info-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px 16px;
    }
    .meta-item { font-size: 0.8rem; }
    .meta-item .mk {
      color: var(--text-muted); font-size: 0.68rem; font-weight: 600;
      letter-spacing: .07em; text-transform: uppercase;
      display: block; margin-bottom: 2px;
    }
    .meta-item .mv { font-weight: 600; }

    /* ai flags */
    .flags-list { display: flex; flex-wrap: wrap; gap: 5px; }
    .flag-badge {
      font-size: 0.66rem; font-weight: 600; padding: 2px 8px; border-radius: 4px;
      background: var(--surface2); color: #c8ccd8; letter-spacing: .04em;
    }

    /* party */
    .party-list { display: flex; flex-direction: column; gap: 10px; }
    .party-card {
      background: var(--surface2);
      border-radius: 8px; padding: 10px 14px;
      display: flex; align-items: flex-start; gap: 12px;
      cursor: pointer; transition: background .15s;
    }
    .party-card:hover { background: #2a2e42; }
    .party-sprite-wrap { flex-shrink: 0; width: 56px; height: 56px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .party-sprite-wrap canvas { image-rendering: pixelated; display: block; max-width: 56px; max-height: 56px; width: auto !important; height: auto !important; }
    .party-sprite-placeholder {
      width: 56px; height: 56px; flex-shrink: 0;
      background: rgba(255,255,255,0.04); border-radius: 4px;
    }
    .party-info { flex: 1; min-width: 0; }
    .party-name {
      font-weight: 700; font-size: 0.9rem; text-transform: capitalize;
      margin-bottom: 4px;
    }
    .party-details {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 3px 12px; margin-bottom: 5px;
    }
    .party-detail-item { font-size: 0.72rem; color: var(--text-muted); }
    .party-detail-item .dk { font-weight: 600; color: var(--text-muted); }
    .party-detail-item .dv { color: var(--text); font-weight: 500; }
    .ev-flags { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 5px; }
    .ev-badge {
      font-size: 0.6rem; font-weight: 700; padding: 1px 5px;
      border-radius: 3px; background: var(--accent2); color: #fff;
      text-transform: uppercase; letter-spacing: .04em;
    }
    .party-moves {
      display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px;
    }
    .move-pill {
      font-size: 0.65rem; font-weight: 600; padding: 2px 7px;
      border-radius: 4px; background: var(--surface);
      color: var(--text-muted); letter-spacing: .02em;
      cursor: pointer; transition: color .15s, background .15s;
    }
    .move-pill:hover { background: #2a2e42; color: var(--text); }

    /* type badge container */
    .types { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }

    /* type badges (reused) */
    .type-badge {
      font-size: 0.63rem; font-weight: 700;
      letter-spacing: .07em; text-transform: uppercase;
      padding: 2px 7px; border-radius: 4px; color: #fff;
    }
    .type-normal   { background: #9a9a7a; }
    .type-fire     { background: #f08030; }
    .type-water    { background: #6890f0; }
    .type-electric { background: #f8d030; color: #333; }
    .type-grass    { background: #78c850; }
    .type-ice      { background: #98d8d8; color: #333; }
    .type-fighting { background: #c03028; }
    .type-poison   { background: #a040a0; }
    .type-ground   { background: #e0c068; color: #333; }
    .type-flying   { background: #a890f0; }
    .type-psychic  { background: #f85888; }
    .type-bug      { background: #a8b820; }
    .type-rock     { background: #b8a038; }
    .type-ghost    { background: #705898; }
    .type-dragon   { background: #7038f8; }
    .type-dark     { background: #705848; }
    .type-steel    { background: #b8b8d0; color: #333; }
    .type-unknown  { background: #68a090; }

    /* move detail modal (same z-index pattern as pokemon.html) */
    #move-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 500; opacity: 0; pointer-events: none;
      transition: opacity var(--tr);
    }
    #move-backdrop.open { opacity: 1; pointer-events: all; }
    #move-panel {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      width: min(560px, calc(100vw - 32px));
      max-height: calc(100vh - 48px);
      overflow-y: auto; padding: 28px; position: relative;
      transform: translateY(20px); transition: transform var(--tr);
    }
    #move-backdrop.open #move-panel { transform: translateY(0); }
    #move-close {
      position: absolute; top: 16px; right: 16px;
      background: rgba(255,255,255,0.06); border: none; border-radius: 50%;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-muted);
      transition: background .2s, color .2s;
    }
    #move-close:hover { background: rgba(255,255,255,0.12); color: var(--text); }
    .move-detail-name { font-size: 1.4rem; font-weight: 800; margin-bottom: 18px; padding-right: 40px; }
    .move-detail-desc { font-size: 0.8rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 18px; }
    .move-detail-badges { display: grid; grid-template-columns: 1fr 1fr; margin-bottom: 16px; }
    .move-detail-badges .col { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
    .move-detail-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; margin-bottom: 16px; }
    .move-detail-meta .meta-item { font-size: 0.8rem; }
    .move-detail-meta .meta-item .mk {
      color: var(--text-muted); font-size: 0.68rem; font-weight: 600;
      letter-spacing: .07em; text-transform: uppercase; display: block; margin-bottom: 2px;
    }
    .move-detail-meta .meta-item .mv { font-weight: 600; }
    .flags-list-move { display: flex; flex-wrap: wrap; gap: 5px; }

    .move-class {
      font-size: 0.62rem; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; padding: 2px 6px; border-radius: 3px;
    }
    .move-class-physical { background: #c03028; color: #fff; }
    .move-class-special  { background: #6890f0; color: #fff; }
    .move-class-status   { background: #555; color: #ccc; }

    /* ── POKEMON DETAIL MODAL (z-index 400, above move modal) ── */
    #pk-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.72);
      display: flex; align-items: center; justify-content: center;
      z-index: 400; opacity: 0; pointer-events: none;
      transition: opacity var(--tr);
    }
    #pk-backdrop.open { opacity: 1; pointer-events: all; }
    #pk-panel {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      width: min(1200px, calc(100vw - 32px));
      max-height: calc(100vh - 48px);
      overflow-y: auto; padding: 28px; position: relative;
      transform: translateY(20px); transition: transform var(--tr);
    }
    #pk-backdrop.open #pk-panel { transform: translateY(0); }
    #pk-close {
      position: absolute; top: 16px; right: 16px;
      background: rgba(255,255,255,0.06); border: none; border-radius: 50%;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-muted);
      transition: background .2s, color .2s;
    }
    #pk-close:hover { background: rgba(255,255,255,0.12); color: var(--text); }
    .pk-detail-name {
      font-size: 1.6rem; font-weight: 800;
      text-transform: capitalize; margin-bottom: 20px; padding-right: 40px;
    }
    .pk-detail-body {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0; min-height: 320px;
    }
    .pk-detail-left {
      display: flex; flex-direction: column; gap: 18px;
      padding-right: 28px;
      border-right: 1px solid rgba(255,255,255,0.07);
    }
    .pk-detail-right { padding-left: 28px; }
    .pk-top-row { display: flex; gap: 20px; align-items: flex-start; }
    .pk-sprite-wrap { flex-shrink: 0; }
    .pk-sprite-wrap canvas { image-rendering: pixelated; display: block; }
    .pk-info { flex: 1; display: flex; flex-direction: column; gap: 18px; }
    .stats-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .stats-table td { padding: 3px 0; }
    .stats-table .sn { color: var(--text-muted); width: 30%; white-space: nowrap; padding-right: 8px; }
    .stats-table .sv { font-weight: 700; width: 30px; text-align: right; padding-right: 10px; }
    .stat-bar-wrap { width: 100%; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
    .stat-bar { height: 100%; border-radius: 3px; background: var(--accent2); }
    .stat-bar.hi  { background: #78c850; }
    .stat-bar.vhi { background: #f8d030; }
    .stats-total {
      display: flex; justify-content: space-between;
      font-size: 0.82rem; padding-top: 6px;
      border-top: 1px solid rgba(255,255,255,0.07); margin-top: 2px;
    }
    .stats-total .lbl { color: var(--text-muted); font-weight: 600; }
    .stats-total .val { font-weight: 800; }
    .pk-detail-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
    .evo-chain { display: flex; flex-direction: column; gap: 6px; }
    .evo-entry {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.82rem; cursor: pointer; border-radius: 6px;
      padding: 3px 6px; margin: 0 -6px; transition: background .15s;
    }
    .evo-entry:hover { background: var(--surface2); }
    .evo-arrow { color: var(--text-muted); font-size: 1rem; }
    .evo-method { font-size: 0.7rem; font-weight: 600; color: var(--text-muted); letter-spacing: .04em; }
    .evo-target { font-weight: 700; text-transform: capitalize; }
    .learnset-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 14px; }
    .ls-tab {
      font-size: 0.7rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
      padding: 5px 12px; border-radius: 6px;
      border: 1.5px solid rgba(255,255,255,0.12);
      background: none; color: var(--text-muted); cursor: pointer; transition: all .15s;
    }
    .ls-tab:hover  { color: var(--text); border-color: rgba(255,255,255,0.3); }
    .ls-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .ls-tab:disabled { opacity: 0.3; cursor: default; }
    .move-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .move-table th {
      text-align: left; color: var(--text-muted);
      font-size: 0.65rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      padding: 0 8px 6px 0; border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .move-table td {
      padding: 5px 8px 5px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: middle;
    }
    .move-table tr:last-child td { border-bottom: none; }
    .move-table tbody tr { cursor: pointer; transition: background .12s; }
    .move-table tbody tr:hover { background: var(--surface2); }
    .move-table .col-lv  { color: var(--accent); font-weight: 700; width: 32px; }
    .move-table .col-tm  { color: var(--text-muted); font-weight: 600; font-size: 0.7rem; width: 38px; }
    .move-table .col-name { font-weight: 600; }
    .move-table .col-pow,
    .move-table .col-acc  { text-align: right; width: 38px; color: var(--text-muted); }
  </style>
</head>
<body>

<div id="overlay"></div>

<!-- ── Sidebar ─────────────────────────────────────── -->
<nav id="sidebar">
  <div class="sidebar-header"><span class="sidebar-title">Navigation</span></div>
  <div class="sidebar-nav">
    <a class="nav-item" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
      </svg>Home
    </a>
    <a class="nav-item" href="/changes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>Changes
    </a>
    <a class="nav-item" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/>
        <line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/>
      </svg>Map

<script>
// ── sidebar ──────────────────────────────────────────────────────
const btn     = document.getElementById('logo-btn');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
const openSidebar  = () => { sidebar.classList.add('open');    overlay.classList.add('visible'); };
const closeSidebar = () => { sidebar.classList.remove('open'); overlay.classList.remove('visible'); };
btn.addEventListener('click', () => sidebar.classList.contains('open') ? closeSidebar() : openSidebar());
overlay.addEventListener('click', closeSidebar);

// ── detail modal ─────────────────────────────────────────────────
const backdrop     = document.getElementById('detail-backdrop');
const detailName   = document.getElementById('detail-name');
const detailSub    = document.getElementById('detail-subtitle');
const detailTop    = document.getElementById('detail-top');
const detailParty  = document.getElementById('detail-party');

document.getElementById('detail-close').addEventListener('click', closeDetail);
backdrop.addEventListener('click', e => { if (e.target === backdrop) closeDetail(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (pkBackdrop.classList.contains('open')) closePokemonDetail();
    else if (moveBackdrop.classList.contains('open')) closeMoveDetail();
    else if (backdrop.classList.contains('open')) closeDetail();
    else closeSidebar();
  }
});

function openDetail(slug) { backdrop.classList.add('open'); loadDetail(slug); }
function closeDetail()    { backdrop.classList.remove('open'); }

// ── pokemon detail modal ──────────────────────────────────────────
const pkBackdrop = document.getElementById('pk-backdrop');
const pkName     = document.getElementById('pk-name');
const pkSprite   = document.getElementById('pk-sprite');
const pkStats    = document.getElementById('pk-stats');
const pkTypes    = document.getElementById('pk-types');
const pkEvo      = document.getElementById('pk-evo');
const pkMisc     = document.getElementById('pk-misc');
const pkRight    = document.getElementById('pk-right');
document.getElementById('pk-close').addEventListener('click', closePokemonDetail);
pkBackdrop.addEventListener('click', e => { if (e.target === pkBackdrop) closePokemonDetail(); });

function openPokemonDetail(name) { pkBackdrop.classList.add('open'); loadPokemonDetail(name); }
function closePokemonDetail()    { pkBackdrop.classList.remove('open'); }

// ── move detail modal ─────────────────────────────────────────────
const moveBackdrop = document.getElementById('move-backdrop');
const moveContent  = document.getElementById('move-content');
document.getElementById('move-close').addEventListener('click', closeMoveDetail);
moveBackdrop.addEventListener('click', e => { if (e.target === moveBackdrop) closeMoveDetail(); });

function openMoveDetail(slug) { moveBackdrop.classList.add('open'); loadMoveDetail(slug); }
function closeMoveDetail()    { moveBackdrop.classList.remove('open'); }

async function loadMoveDetail(slug) {
  moveContent.innerHTML = '<p style="color:var(--text-muted);padding:20px 0">Loading…</p>';
  let d;
  try {
    d = await fetch(`/api/moves/${slug}`).then(r => r.json());
  } catch {
    moveContent.innerHTML = '<p style="color:var(--text-muted)">Error loading data.</p>';
    return;
  }
  const desc = (d.description || []).join('').replace(/\n/g, ' ').trim();
  const priorityStr = d.priority > 0 ? `+${d.priority}` : `${d.priority ?? 0}`;
  const effectVal = d.effect
    ? fmtConst(d.effect.type) + (d.effect.chance ? ` (${d.effect.chance}%)` : '')
    : '';
  const contestVal = d.contest ? fmtConst(d.contest.type) : '';
  const flags = (d.flags || []).map(f =>
    `<span class="flag-badge">${fmtConst(f)}</span>`
  ).join('');
  moveContent.innerHTML = `
    <div class="move-detail-name">${d.name || slug}</div>
    ${desc ? `<div class="move-detail-desc">${desc}</div>` : ''}
    <div class="move-detail-badges">
      <div class="col"><div class="section-title">Type</div>${d.type ? `<span class="type-badge ${typeClass(d.type)}">${typeLabel(d.type)}</span>` : '—'}</div>
      <div class="col"><div class="section-title">Class</div>${d.class ? classBadge(d.class) : '—'}</div>
    </div>
    <div class="section-title">Stats</div>
    <div class="move-detail-meta">
      <div class="meta-item"><span class="mk">Power</span>   <span class="mv">${d.power || '—'}</span></div>
      <div class="meta-item"><span class="mk">Accuracy</span><span class="mv">${d.accuracy ? d.accuracy + '%' : '—'}</span></div>
      <div class="meta-item"><span class="mk">PP</span>      <span class="mv">${d.pp ?? '—'}</span></div>
      <div class="meta-item"><span class="mk">Priority</span><span class="mv">${priorityStr}</span></div>
      <div class="meta-item"><span class="mk">Range</span>   <span class="mv">${fmtConst(d.range) || '—'}</span></div>
      ${effectVal  ? `<div class="meta-item"><span class="mk">Effect</span>  <span class="mv">${effectVal}</span></div>` : ''}
      ${contestVal ? `<div class="meta-item"><span class="mk">Contest</span><span class="mv">${contestVal}</span></div>` : ''}
    </div>
    ${flags ? `<div class="section-title" style="margin-bottom:8px">Flags</div><div class="flags-list-move">${flags}</div>` : ''}
  `;
}

// ── helpers ──────────────────────────────────────────────────────
function fmtConst(s) {
  return (s || '').replace(/^[A-Z]+?_/, '').replace(/_/g, ' ')
    .toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}

function fmtClassName(cls) {
  // "TRAINER_CLASS_ACE_TRAINER_MALE" → "Ace Trainer Male"
  return (cls || '').replace(/^TRAINER_CLASS_/, '').replace(/_/g, ' ')
    .toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}

function fmtMsgType(t) {
  return (t || '').replace(/^TRMSG_/, '').replace(/_/g, ' ')
    .toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}

function fmtSlug(slug) {
  return slug.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

const TYPE_RE = /^TYPE_(.+)$/;
function typeKey(raw)   { const m = raw.match(TYPE_RE); return m ? m[1].toLowerCase() : 'unknown'; }
function typeLabel(raw) { const k = typeKey(raw); return k.charAt(0).toUpperCase() + k.slice(1); }
function typeClass(raw) { return 'type-' + typeKey(raw); }

function classBadge(cls) {
  const map = { CLASS_PHYSICAL: 'physical', CLASS_SPECIAL: 'special', CLASS_STATUS: 'status' };
  const k = map[cls] || 'status';
  const label = k.charAt(0).toUpperCase() + k.slice(1);
  return `<span class="move-class move-class-${k}">${label}</span>`;
}

function moveSlug(moveConst) {
  return moveConst.replace(/^MOVE_/, '').toLowerCase();
}

function speciesFolder(speciesConst) {
  return (speciesConst || '').replace(/^SPECIES_/, '').toLowerCase();
}

// Draw left half of double-wide sprite onto a canvas
function makeSpriteCanvas(url, scale = 1) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const halfW = Math.floor(img.naturalWidth / 2);
      const c = document.createElement('canvas');
      c.width  = halfW;
      c.height = img.naturalHeight;
      c.getContext('2d').drawImage(img, 0, 0);
      c.style.width  = (halfW             * scale) + 'px';
      c.style.height = (img.naturalHeight * scale) + 'px';
      resolve(c);
    };
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

function typeBadge(raw) {
  const el = document.createElement('span');
  el.className = 'type-badge ' + typeClass(raw);
  el.textContent = typeLabel(raw);
  return el;
}

const STAT_LABELS = { hp:'HP', attack:'Atk', defense:'Def', special_attack:'SpA', special_defense:'SpD', speed:'Spe' };
const STAT_MAX = 255;
function statBarCls(v) { return v >= 130 ? 'hi vhi' : v >= 90 ? 'hi' : ''; }

function buildStatsBlock(stats) {
  const wrap = document.createElement('div');
  const title = document.createElement('div');
  title.className = 'section-title'; title.textContent = 'Base Stats';
  wrap.appendChild(title);
  const table = document.createElement('table');
  table.className = 'stats-table';
  let total = 0;
  for (const [key, label] of Object.entries(STAT_LABELS)) {
    const v = stats[key] ?? 0; total += v;
    const pct = Math.round((v / STAT_MAX) * 100);
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="sn">${label}</td><td class="sv">${v}</td>
      <td><div class="stat-bar-wrap"><div class="stat-bar ${statBarCls(v)}" style="width:${pct}%"></div></div></td>`;
    table.appendChild(tr);
  }
  wrap.appendChild(table);
  const tot = document.createElement('div');
  tot.className = 'stats-total';
  tot.innerHTML = `<span class="lbl">Total</span><span class="val">${total}</span>`;
  wrap.appendChild(tot);
  return wrap;
}

const LEARNSET_TABS = [
  { key: 'by_level',  label: 'By Level' },
  { key: 'by_tm',     label: 'TM / HM'  },
  { key: 'by_tutor',  label: 'Tutor'    },
  { key: 'egg_moves', label: 'Egg'      },
];

function buildLearnsetPanel(learnset) {
  const wrap = document.createElement('div');
  const title = document.createElement('div');
  title.className = 'section-title'; title.textContent = 'Learnset';
  wrap.appendChild(title);
  const tabBar = document.createElement('div');
  tabBar.className = 'learnset-tabs';
  const tableWrap = document.createElement('div');

  function showTab(key) {
    tabBar.querySelectorAll('.ls-tab').forEach(b => b.classList.toggle('active', b.dataset.key === key));
    tableWrap.innerHTML = '';
    const moves = learnset[key] || [];
    if (!moves.length) {
      tableWrap.innerHTML = '<p style="color:var(--text-muted);font-size:0.8rem;padding:8px 0">None</p>';
      return;
    }
    const table = document.createElement('table');
    table.className = 'move-table';
    const thead = document.createElement('thead');
    let thHTML = '';
    if (key === 'by_level') thHTML += '<th class="col-lv">Lv</th>';
    if (key === 'by_tm')    thHTML += '<th class="col-tm">TM</th>';
    thHTML += '<th class="col-name">Move</th><th>Type</th><th>Cat</th><th class="col-pow">Pow</th><th class="col-acc">Acc</th>';
    thead.innerHTML = `<tr>${thHTML}</tr>`;
    table.appendChild(thead);
    const tbody = document.createElement('tbody');
    moves.forEach(m => {
      const tr = document.createElement('tr');
      let html = '';
      if (key === 'by_level') html += `<td class="col-lv">${m.level}</td>`;
      if (key === 'by_tm')    html += `<td class="col-tm">${m.tm}</td>`;
      html += `<td class="col-name">${m.name ?? '—'}</td>`;
      html += `<td>${m.type ? `<span class="type-badge ${typeClass(m.type)}">${typeLabel(m.type)}</span>` : '—'}</td>`;
      html += `<td>${m.class ? classBadge(m.class) : '—'}</td>`;
      html += `<td class="col-pow">${m.power || '—'}</td>`;
      html += `<td class="col-acc">${m.accuracy || '—'}</td>`;
      tr.innerHTML = html;
      if (m.slug) tr.addEventListener('click', () => openMoveDetail(m.slug));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    tableWrap.appendChild(table);
  }

  LEARNSET_TABS.forEach(({ key, label }) => {
    const b = document.createElement('button');
    b.className = 'ls-tab'; b.dataset.key = key; b.textContent = label;
    if (!(learnset[key] || []).length) b.disabled = true;
    b.addEventListener('click', () => showTab(key));
    tabBar.appendChild(b);
  });
  wrap.appendChild(tabBar);
  wrap.appendChild(tableWrap);
  const first = LEARNSET_TABS.find(({ key }) => (learnset[key] || []).length > 0);
  if (first) showTab(first.key);
  return wrap;
}

function fmtEvoMethod(method, value) {
  const item    = () => fmtConst(String(value));
  const move    = () => fmtConst(String(value));
  const species = () => fmtConst(String(value));
  switch (method) {
    case 'EVO_LEVEL':                        return `Lv. ${value}`;
    case 'EVO_LEVEL_MALE':                   return `Lv. ${value} (Male)`;
    case 'EVO_LEVEL_FEMALE':                 return `Lv. ${value} (Female)`;
    case 'EVO_LEVEL_DAY':                    return `Lv. ${value} (Day)`;
    case 'EVO_LEVEL_NIGHT':                  return `Lv. ${value} (Night)`;
    case 'EVO_LEVEL_NINJASK':                return `Lv. ${value}`;
    case 'EVO_LEVEL_SHEDINJA':               return 'Empty Slot & Extra Ball';
    case 'EVO_LEVEL_HAPPINESS':              return 'Happiness';
    case 'EVO_LEVEL_HAPPINESS_DAY':          return 'Happiness (Day)';
    case 'EVO_LEVEL_HAPPINESS_NIGHT':        return 'Happiness (Night)';
    case 'EVO_LEVEL_BEAUTY':                 return `Beauty ${value}`;
    case 'EVO_LEVEL_ATK_GT_DEF':             return `Lv. ${value} (Atk > Def)`;
    case 'EVO_LEVEL_ATK_EQ_DEF':             return `Lv. ${value} (Atk = Def)`;
    case 'EVO_LEVEL_ATK_LT_DEF':             return `Lv. ${value} (Atk < Def)`;
    case 'EVO_LEVEL_WITH_HELD_ITEM':         return `Lv. up w/ ${item()}`;
    case 'EVO_LEVEL_WITH_HELD_ITEM_DAY':     return `Lv. up w/ ${item()} (Day)`;
    case 'EVO_LEVEL_WITH_HELD_ITEM_NIGHT':   return `Lv. up w/ ${item()} (Night)`;
    case 'EVO_LEVEL_KNOW_MOVE':              return `Lv. up knowing ${move()}`;
    case 'EVO_LEVEL_SPECIES_IN_PARTY':       return `Lv. up w/ ${species()} in party`;
    case 'EVO_LEVEL_MAGNETIC_FIELD':         return 'Lv. up (Magnetic Field)';
    case 'EVO_LEVEL_MOSS_ROCK':              return 'Lv. up (Moss Rock)';
    case 'EVO_LEVEL_ICE_ROCK':               return 'Lv. up (Ice Rock)';
    case 'EVO_USE_ITEM':                     return `Use ${item()}`;
    case 'EVO_USE_ITEM_MALE':                return `Use ${item()} (Male)`;
    case 'EVO_USE_ITEM_FEMALE':              return `Use ${item()} (Female)`;
    case 'EVO_TRADE':                        return 'Trade';
    case 'EVO_TRADE_WITH_HELD_ITEM':         return `Trade w/ ${item()}`;
    default:                                 return fmtConst(method) + (value ? ` ${value}` : '');
  }
}

async function loadPokemonDetail(name) {
  pkName.textContent  = '…';
  pkSprite.innerHTML  = '';
  pkStats.innerHTML   = '';
  pkTypes.innerHTML   = '';
  pkEvo.innerHTML     = '';
  pkMisc.innerHTML    = '';
  pkRight.innerHTML   = '';

  let d;
  try {
    d = await fetch(`/api/pokemon/${name}`).then(r => r.json());
  } catch {
    pkName.textContent = 'Error loading data'; return;
  }

  pkName.textContent = name.replace(/-/g, ' ');

  const sprCanvas = await makeSpriteCanvas(`/sprites/${name}/male`, 2.8)
    ?? await makeSpriteCanvas(`/sprites/${name}/female`, 2.8);
  if (sprCanvas) {
    pkSprite.appendChild(sprCanvas);
    pkStats.style.height = sprCanvas.style.height;
  }

  if (d.base_stats) pkStats.appendChild(buildStatsBlock(d.base_stats));

  const entryLines = d.pokedex_data?.en?.entry_text;
  if (entryLines) {
    const entryEl = document.createElement('p');
    entryEl.style.cssText = 'font-size:0.8rem; color:var(--text-muted); line-height:1.5; margin-top:8px;';
    entryEl.textContent = entryLines.join('').replace(/\n/g, ' ').trim();
    pkStats.appendChild(entryEl);
  }

  // types
  const types = [...new Set(d.types || [])];
  const typesTitle = document.createElement('div');
  typesTitle.className = 'section-title'; typesTitle.textContent = 'Type';
  pkTypes.appendChild(typesTitle);
  const typesBadges = document.createElement('div');
  typesBadges.className = 'types'; typesBadges.style.justifyContent = 'flex-start';
  types.forEach(t => typesBadges.appendChild(typeBadge(t)));
  pkTypes.appendChild(typesBadges);

  // evolutions
  const evoRow = document.createElement('div');
  evoRow.style.cssText = 'display:grid; grid-template-columns:1fr 1fr; gap:28px; align-items:flex-start;';
  const evos = d.evolutions || [];
  if (evos.length) {
    const evoWrap = document.createElement('div');
    const evoTitle = document.createElement('div');
    evoTitle.className = 'section-title'; evoTitle.textContent = 'Evolution';
    evoWrap.appendChild(evoTitle);
    const chain = document.createElement('div');
    chain.className = 'evo-chain';
    evos.forEach(evo => {
      const method = evo[0], target = evo[evo.length - 1], value = evo.length === 3 ? evo[1] : null;
      const targetFolder = target.replace(/^SPECIES_/, '').toLowerCase();
      const targetStr    = targetFolder.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      const entry = document.createElement('div');
      entry.className = 'evo-entry';
      entry.innerHTML = `<span class="evo-arrow">→</span><span class="evo-target">${targetStr}</span><span class="evo-method">(${fmtEvoMethod(method, value)})</span>`;
      entry.addEventListener('click', () => openPokemonDetail(targetFolder));
      chain.appendChild(entry);
    });
    evoWrap.appendChild(chain);
    evoRow.appendChild(evoWrap);
  } else {
    evoRow.appendChild(document.createElement('div'));
  }
  const offspring = d.offspring || '';
  const offSelf = offspring.replace(/^SPECIES_/, '').toLowerCase() === name;
  if (offspring && offspring !== 'SPECIES_NONE' && !offSelf) {
    const offFolder = offspring.replace(/^SPECIES_/, '').toLowerCase();
    const offStr    = offFolder.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    const offWrap = document.createElement('div');
    const offTitle = document.createElement('div');
    offTitle.className = 'section-title'; offTitle.textContent = 'Offspring';
    offWrap.appendChild(offTitle);
    const offEntry = document.createElement('div');
    offEntry.className = 'evo-entry';
    offEntry.innerHTML = `<span class="evo-target">${offStr}</span>`;
    offEntry.addEventListener('click', () => openPokemonDetail(offFolder));
    offWrap.appendChild(offEntry);
    evoRow.appendChild(offWrap);
  }
  if (evoRow.children.length) pkEvo.appendChild(evoRow);

  // misc info
  const miscTitle = document.createElement('div');
  miscTitle.className = 'section-title'; miscTitle.textContent = 'Info';
  pkMisc.appendChild(miscTitle);
  const abilities = (d.abilities || []).filter(a => a !== 'ABILITY_NONE').map(fmtConst);
  const eggGroups = [...new Set((d.egg_groups || []).filter(g => g !== 'EGG_GROUP_NONE').map(fmtConst))];
  const pkInfoRows = [
    ['Abilities',    abilities.join(', ')         || '—'],
    ['Egg Groups',   eggGroups.join(', ')          || '—'],
    ['Catch Rate',   d.catch_rate                 ?? '—'],
    ['Base Exp',     d.base_exp_reward            ?? '—'],
    ['Hatch Cycles', d.hatch_cycles               ?? '—'],
    ['Friendship',   d.base_friendship            ?? '—'],
    ['Exp Rate',     fmtConst(d.exp_rate    || '') || '—'],
    ['Gender',       fmtConst(d.gender_ratio|| '') || '—'],
  ];
  const pkMeta = document.createElement('div');
  pkMeta.className = 'pk-detail-meta';
  pkInfoRows.forEach(([k, v]) => {
    const item = document.createElement('div');
    item.className = 'meta-item';
    item.innerHTML = `<span class="mk">${k}</span><span class="mv">${v}</span>`;
    pkMeta.appendChild(item);
  });
  pkMisc.appendChild(pkMeta);

  if (d.learnset_resolved) pkRight.appendChild(buildLearnsetPanel(d.learnset_resolved));
}

// Draws the top-left 80×80 pixels of a trainer class icon onto a canvas
function makeTrainerIconCanvas(url, cssSize = 80) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width  = 80;
      c.height = 80;
      c.getContext('2d').drawImage(img, 0, 0);
      c.style.width  = cssSize + 'px';
      c.style.height = cssSize + 'px';
      resolve(c);
    };
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

// ── card builder ─────────────────────────────────────────────────
function buildCard(tr) {
  const card = document.createElement('div');
  card.className = 'tr-card';
  card.addEventListener('click', () => openDetail(tr.slug));

  if (tr.has_icon) {
    const wrap = document.createElement('div');
    wrap.className = 'tr-icon-placeholder'; // placeholder size while loading
    wrap.style.background = 'transparent';
    makeTrainerIconCanvas(`/trainer-icon/${tr.class_folder}`).then(c => {
      if (c) { c.className = 'tr-icon-canvas'; wrap.replaceWith(c); }
    });
    card.appendChild(wrap);
  } else {
    const ph = document.createElement('div');
    ph.className = 'tr-icon-placeholder';
    ph.textContent = '?';
    card.appendChild(ph);
  }

  const nameEl = document.createElement('div');
  nameEl.className = 'tr-name';
  nameEl.textContent = tr.name;
  card.appendChild(nameEl);

  const slugEl = document.createElement('div');
  slugEl.className = 'tr-slug-label';
  slugEl.textContent = fmtSlug(tr.slug);
  card.appendChild(slugEl);

  const clsEl = document.createElement('div');
  clsEl.className = 'tr-class-label';
  clsEl.textContent = fmtClassName(tr.class);
  card.appendChild(clsEl);

  return card;
}

async function loadDetail(slug) {
  detailName.textContent = '…';
  detailSub.textContent  = '';
  detailTop.innerHTML    = '';
  detailParty.innerHTML  = '';

  let d;
  try {
    d = await fetch(`/api/trainers/${slug}`).then(r => r.json());
  } catch {
    detailName.textContent = 'Error loading data';
    return;
  }

  detailName.innerHTML = `${d.name || fmtSlug(slug)}<span class="detail-slug">(${fmtSlug(slug)})</span>`;
  detailSub.textContent  = fmtClassName(d.class);

  // ── TOP SECTION: icon | info | AI flags ───────────────────────
  const topSection = document.createElement('div');
  topSection.className = 'detail-top-section';

  // column 1: trainer icon (cropped to 80×80)
  if (d.has_icon) {
    makeTrainerIconCanvas(`/trainer-icon/${d.class_folder}`, 80).then(c => {
      if (c) { c.className = 'trainer-icon-canvas'; topSection.prepend(c); }
    });
  }

  // column 2: class / double battle / party size / held items
  const infoCol = document.createElement('div');
  infoCol.className = 'detail-info-col';
  const meta = document.createElement('div');
  meta.className = 'info-grid';
  [
    ['Class',         fmtClassName(d.class)],
    ['Double Battle', d.double_battle ? 'Yes' : 'No'],
    ['Party Size',    (d.party || []).length],
    ['Held Items',    (d.items || []).map(fmtConst).join(', ') || 'None'],
  ].forEach(([k, v]) => {
    meta.innerHTML += `<div class="meta-item"><span class="mk">${k}</span><span class="mv">${v}</span></div>`;
  });
  infoCol.appendChild(meta);
  topSection.appendChild(infoCol);

  // column 3: AI flags
  const aiFlags = (d.ai_flags || []);
  if (aiFlags.length) {
    const aiCol = document.createElement('div');
    aiCol.className = 'detail-info-col';
    const aiTitle = document.createElement('div');
    aiTitle.className = 'section-title';
    aiTitle.textContent = 'AI Flags';
    aiCol.appendChild(aiTitle);
    const flagsEl = document.createElement('div');
    flagsEl.className = 'flags-list';
    aiFlags.forEach(f => {
      const b = document.createElement('span');
      b.className = 'flag-badge';
      b.textContent = fmtConst(f);
      flagsEl.appendChild(b);
    });
    aiCol.appendChild(flagsEl);
    topSection.appendChild(aiCol);
  }

  detailTop.appendChild(topSection);

  // ── PARTY GRID (2x2) ─────────────────────────────────────────
  const partyTitle = document.createElement('div');
  partyTitle.className = 'section-title';
  partyTitle.textContent = 'Party';
  detailParty.appendChild(partyTitle);

  const partyGrid = document.createElement('div');
  partyGrid.className = 'detail-party-grid';

  // fetch pokemon type data for all party members in parallel
  const partyPkData = await Promise.all(
    (d.party || []).map(pk =>
      fetch(`/api/pokemon/${speciesFolder(pk.species)}`).then(r => r.json()).catch(() => null)
    )
  );

  (d.party || []).forEach((pk, i) => {
    const pkData    = partyPkData[i];
    const sprFolder = speciesFolder(pk.species);

    const card = document.createElement('div');
    card.className = 'party-card';
    card.addEventListener('click', () => openPokemonDetail(sprFolder));

    // sprite via canvas (left half of double-wide sheet)
    const sprWrap = document.createElement('div');
    sprWrap.className = 'party-sprite-wrap';
    makeSpriteCanvas(`/sprites/${sprFolder}/male`, 1.5).then(c => {
      if (c) { sprWrap.appendChild(c); return; }
      return makeSpriteCanvas(`/sprites/${sprFolder}/female`, 1.5).then(cf => {
        if (cf) sprWrap.appendChild(cf);
        else sprWrap.classList.add('party-sprite-placeholder');
      });
    });
    card.appendChild(sprWrap);

    const info = document.createElement('div');
    info.className = 'party-info';

    // name + types as first row of the same 2-column grid as detail items
    const nameRow = document.createElement('div');
    nameRow.style.cssText = 'display:grid; grid-template-columns:1fr 1fr; gap:3px 12px; margin-bottom:4px; align-items:center;';
    const nameEl = document.createElement('div');
    nameEl.className = 'party-name';
    nameEl.style.margin = '0';
    nameEl.textContent = sprFolder.replace(/_/g, ' ');
    nameRow.appendChild(nameEl);
    if (pkData?.types?.length) {
      const typesEl = document.createElement('div');
      typesEl.className = 'types';
      typesEl.style.cssText = 'justify-content:flex-start; flex-wrap:nowrap; gap:4px;';
      [...new Set(pkData.types)].forEach(t => typesEl.appendChild(typeBadge(t)));
      nameRow.appendChild(typesEl);
    }
    info.appendChild(nameRow);

    // detail grid
    const ivVal       = pk.iv_scale != null ? Math.round(pk.iv_scale / 255.0 * 31) : '—';
    const abilityVal  = (!pk.ability || pk.ability === 'ABILITY_NONE') ? 'Default' : fmtConst(pk.ability);
    const natureVal   = (!pk.nature  || pk.nature  === 'NATURE_NONE')  ? 'Random'  : fmtConst(pk.nature);
    const itemVal     = (!pk.item    || pk.item    === 'ITEM_NONE')     ? '—'       : fmtConst(pk.item);

    const details = document.createElement('div');
    details.className = 'party-details';
    [
      ['Level',      pk.level],
      ['Item',       itemVal],
      ['IVs',        ivVal],
      ['Friendship', pk.friendship ?? '—'],
      ['Ability',    abilityVal],
      ['Nature',     natureVal],
    ].forEach(([k, v]) => {
      const el = document.createElement('div');
      el.className = 'party-detail-item';
      el.innerHTML = `<span class="dk">${k}:</span> <span class="dv">${v}</span>`;
      details.appendChild(el);
    });
    info.appendChild(details);

    // EV flags — formatted as a single detail row spanning both columns
    const evFlags  = pk.evFlags || {};
    const activeEvs = Object.entries(evFlags).filter(([, v]) => v)
      .map(([k]) => k.charAt(0).toUpperCase() + k.slice(1));
    if (activeEvs.length) {
      const evEl = document.createElement('div');
      evEl.className = 'party-detail-item';
      evEl.style.gridColumn = '1 / -1';
      evEl.innerHTML = `<span class="dk">EV Flags:</span> <span class="dv">${activeEvs.join(', ')}</span>`;
      details.appendChild(evEl);
    }

    // moves
    const moves = (pk.moves || []).filter(m => m && m !== 'MOVE_NONE');
    if (moves.length) {
      const movesTitle = document.createElement('div');
      movesTitle.className = 'section-title';
      movesTitle.style.marginTop = '6px';
      movesTitle.textContent = 'Moves';
      info.appendChild(movesTitle);
      const movesEl = document.createElement('div');
      movesEl.className = 'party-moves';
      moves.forEach(m => {
        const pill = document.createElement('span');
        pill.className = 'move-pill';
        pill.textContent = fmtConst(m);
        pill.addEventListener('click', e => { e.stopPropagation(); openMoveDetail(moveSlug(m)); });
        movesEl.appendChild(pill);
      });
      info.appendChild(movesEl);
    }

    card.appendChild(info);
    partyGrid.appendChild(card);
  });

  detailParty.appendChild(partyGrid);
}

// ── filter + render ───────────────────────────────────────────────
let allTrainers = [];
const grid    = document.getElementById('grid');
const loading = document.getElementById('loading');
const empty   = document.getElementById('empty');
const countEl = document.getElementById('count');
const search  = document.getElementById('search');

function applyFilters() {
  const q = search.value.trim().toLowerCase();
  let list = allTrainers;
  if (q) {
    const words = q.split(/\s+/).filter(Boolean);
    const haystack = t => [
      t.name, fmtClassName(t.class), t.slug, fmtSlug(t.slug)
    ].join(' ').toLowerCase();
    list = list.filter(t => words.every(w => haystack(t).includes(w)));
  }
  render(list);
}

function render(list) {
  grid.innerHTML = '';
  empty.style.display = list.length === 0 ? 'block' : 'none';
  countEl.textContent = `${list.length} Trainers`;
  list.forEach(tr => grid.appendChild(buildCard(tr)));
}

fetch('/api/trainers')
  .then(r => r.json())
  .then(data => {
    allTrainers = data;
    loading.style.display = 'none';
    render(allTrainers);
  })
  .catch(() => { loading.textContent = 'Failed to load data. Is the server running?'; });

search.addEventListener('input', applyFilters);
</script>
